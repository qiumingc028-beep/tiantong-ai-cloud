name: jd-desktop-agent-windows
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: apps/jd-desktop-agent/package-lock.json}
      - shell: bash
      - run: npm ci
        working-directory: apps/jd-desktop-agent
      - run: npx playwright install chromium
        working-directory: apps/jd-desktop-agent
        env: {PLAYWRIGHT_BROWSERS_PATH: "0"}
      - shell: pwsh
        run: if (-not (Test-Path "apps/jd-desktop-agent/node_modules/playwright-core/.local-browsers")) { throw "Chromium missing" }
      - run: npm run build
        working-directory: apps/jd-desktop-agent
      - run: npm test
        working-directory: apps/jd-desktop-agent
      - run: npm run package:win
        working-directory: apps/jd-desktop-agent
        env: {PLAYWRIGHT_BROWSERS_PATH: "0"}
      - shell: pwsh
        run: Get-ChildItem apps/jd-desktop-agent/dist-electron -File | Get-FileHash -Algorithm SHA256 | Format-Table
      - uses: actions/upload-artifact@v4
        with: {name: tiantong-jd-desktop-agent-unsigned, path: apps/jd-desktop-agent/dist-electron/*}
