name: jd-desktop-agent-windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/jd-desktop-agent/package-lock.json
      - run: npm ci
        working-directory: apps/jd-desktop-agent
      - run: npx playwright install chromium
        working-directory: apps/jd-desktop-agent
        env: {PLAYWRIGHT_BROWSERS_PATH: "0"}
      - shell: pwsh
        run: if (-not (Test-Path "apps/jd-desktop-agent/node_modules/playwright-core/.local-browsers")) { throw "Chromium missing" }
      - run: npm run build
        working-directory: apps/jd-desktop-agent
      - run: npm test
        working-directory: apps/jd-desktop-agent
      - run: npm run package:win
        working-directory: apps/jd-desktop-agent
        env: {PLAYWRIGHT_BROWSERS_PATH: "0"}
      - shell: pwsh
        run: |
          $nsis = "apps/jd-desktop-agent/dist-electron/Tiantong-JD-Readonly-Agent-Setup-0.1.0-x64.exe"
          $zip = "apps/jd-desktop-agent/dist-electron/Tiantong-JD-Readonly-Agent-Portable-0.1.0-x64.zip"
          if (!(Test-Path $nsis) -or !(Test-Path $zip)) { throw "installer outputs missing" }
          Get-FileHash $nsis,$zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with: {name: tiantong-jd-desktop-agent-unsigned, path: apps/jd-desktop-agent/dist-electron/*}
