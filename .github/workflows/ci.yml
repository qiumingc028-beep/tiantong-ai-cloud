name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "sprint*"
      - "feature/**"
      - "codex/r291-*"
      - codex/r297-cloud-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      V2_ALPHA_POSTGRES_ADMIN_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/postgres
      STORE_AUTHZ_POSTGRES_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      MIGRATION_CODE_FIX_COMMIT: 8d9b5f2890545f1f08d05b9b1618f71ff82d6621
      RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      S12_BACKEND_IMAGE: tiantong-ci-backend:${{ github.event.pull_request.head.sha || github.sha }}
      S12_WORKER_IMAGE: tiantong-ci-worker:${{ github.event.pull_request.head.sha || github.sha }}
      S12_JD_RUNTIME_IMAGE: tiantong-ci-jd-browser-runtime:${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify CI PostgreSQL isolation
        run: |
          python - <<'PY'
          import os
          import uuid

          import psycopg2
          from psycopg2 import sql
          from sqlalchemy.engine import make_url

          database_name = f"alpha_s11_ci_probe_{uuid.uuid4().hex[:12]}"
          admin_url = make_url(os.environ["V2_ALPHA_POSTGRES_ADMIN_URL"])
          admin_dsn = admin_url.set(drivername="postgresql").render_as_string(hide_password=False)
          connection = psycopg2.connect(admin_dsn)
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(database_name)))
                  cursor.execute(sql.SQL("DROP DATABASE {}").format(sql.Identifier(database_name)))
          finally:
              connection.close()
          PY

      - name: Verify CI Redis isolation
        run: |
          python - <<'PY'
          import os

          import redis

          client = redis.Redis.from_url(os.environ["REDIS_URL"], decode_responses=True)
          assert client.ping() is True
          assert client.llen("tiantong:employee:tianshang:execution") == 0
          assert client.llen("tiantong:execution:tasks") == 0
          assert list(client.scan_iter("tiantong:execution:lock:*")) == []
          PY

      - name: Syntax check
        run: python -m py_compile $(find backend tests -name '*.py')

      - name: Run JD cloud browser runtime Node tests
        working-directory: services/jd-cloud-browser-runtime
        run: npm ci --no-audit --no-fund && npm test

      - name: Prepare verified amd64 wheelhouse
        run: |
          wheelhouse=artifacts/wheelhouse/linux-amd64-cp312
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --implementation cp \
            --python-version 3.12 \
            --abi cp312 \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux2014_x86_64 \
            --platform manylinux_2_24_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --dest "$wheelhouse" \
            --requirement "$wheelhouse/requirements-linux-amd64-cp312.lock"
          cd "$wheelhouse"
          sha256sum --check SHA256SUMS

      - name: Build temporary backend and worker test images
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          source_date_epoch="$(git show -s --format=%ct "$RELEASE_SOURCE_SHA")"
          docker build \
            --pull=false \
            --network=none \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --label "org.opencontainers.image.revision=$RELEASE_SOURCE_SHA" \
            --file Dockerfile.backend \
            --tag "$S12_BACKEND_IMAGE" \
            .
          docker build \
            --pull=false \
            --network=none \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --label "org.opencontainers.image.revision=$RELEASE_SOURCE_SHA" \
            --file Dockerfile.worker \
            --tag "$S12_WORKER_IMAGE" \
            .

      - name: Build JD cloud browser runtime image
        run: |
          docker build \
            --pull=false \
            --file services/jd-cloud-browser-runtime/Dockerfile \
            --tag "$S12_JD_RUNTIME_IMAGE" \
            .

      - name: Verify JD cloud browser runtime container
        run: |
          set -euo pipefail
          container="jd-browser-runtime-${RELEASE_SOURCE_SHA:0:12}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          if docker run --rm "$S12_JD_RUNTIME_IMAGE" >/tmp/runtime-missing-token.log 2>&1; then
            echo "Runtime unexpectedly started without an internal token" >&2
            exit 1
          fi
          grep -F "JD_BROWSER_CAPTURE_TOKEN_REQUIRED" /tmp/runtime-missing-token.log >/dev/null

          capture_token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          control_token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          viewer_signing_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          master_key="$(python -c 'import base64; print(base64.b64encode(bytes(range(32))).decode())')"
          docker run --detach \
            --name "$container" \
            --cap-drop ALL \
            --cap-add SYS_CHROOT \
            --read-only \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=services/jd-cloud-browser-runtime/seccomp_profile.json \
            --shm-size=1g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /tmp/.X11-unix:rw,nosuid,nodev,noexec,size=1m,uid=0,gid=0,mode=1777 \
            --tmpfs /data/jd-session-archives:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --publish 127.0.0.1::8787 \
            --publish 127.0.0.1::6080 \
            --env "JD_BROWSER_CAPTURE_TOKEN=$capture_token" \
            --env "JD_BROWSER_CONTROL_TOKEN=$control_token" \
            --env "JD_BROWSER_VIEWER_SIGNING_KEY=$viewer_signing_key" \
            --env "JD_SESSION_MASTER_KEY=$master_key" \
            --env PORT=8787 \
            --env DISPLAY=:99 \
            --env JD_PROFILE_ROOT=/tmp/jd-cloud-profiles \
            --env JD_SESSION_ARCHIVE_ROOT=/data/jd-session-archives \
            "$S12_JD_RUNTIME_IMAGE" >/dev/null

          runtime_port="$(docker port "$container" 8787/tcp | awk -F: 'END {print $NF}')"
          novnc_port="$(docker port "$container" 6080/tcp | awk -F: 'END {print $NF}')"
          status=000
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /tmp/runtime-health.json --write-out '%{http_code}' \
              --header "x-internal-token: $control_token" \
              "http://127.0.0.1:$runtime_port/internal/jd-browser/health" || true)"
            test "$status" = 200 && break
            sleep 1
          done
          test "$status" = 200
          echo "RUNTIME_HEALTH_STATUS=200"

          session_status="$(curl --silent --show-error --output /tmp/runtime-session.json --write-out '%{http_code}' \
            --header "content-type: application/json" \
            --header "x-internal-token: $control_token" \
            --data '{"tenant_id":1,"company_id":1,"store_id":1,"platform":"jd"}' \
            "http://127.0.0.1:$runtime_port/internal/jd-browser/sessions")"
          if test "$session_status" != 200; then
            docker logs "$container"
            docker exec "$container" node --input-type=module -e '
              import { chromium } from "playwright";
              try {
                const context = await chromium.launchPersistentContext("/tmp/chromium-diagnostic", {
                  headless: false,
                  chromiumSandbox: true
                });
                await context.close();
              } catch (error) {
                console.error(error);
                process.exit(1);
              }
            '
            exit 1
          fi

          process_pid() {
            docker exec "$container" sh -c '
              expected="$1"
              for process in /proc/[0-9]*; do
                test -r "$process/comm" || continue
                test "$(cat "$process/comm")" = "$expected" || continue
                printf "%s\n" "${process##*/}"
                break
              done
            ' sh "$1"
          }
          xvfb_pid="$(process_pid Xvfb)"
          chromium_pid="$(process_pid chrome)"
          test -n "$xvfb_pid" && test -n "$chromium_pid"
          echo "RUNTIME_XVFB_PID=$xvfb_pid"
          echo "RUNTIME_CHROMIUM_PID=$chromium_pid"

          runtime_uid="$(docker exec "$container" id -u)"
          test "$runtime_uid" != 0
          echo "RUNTIME_UID=$runtime_uid"
          for forbidden in DATABASE_URL REDIS_URL POSTGRES_ADMIN_PASSWORD REDIS_PASSWORD JWT_SECRET BOSS_INITIAL_PASSWORD; do
            ! docker exec "$container" env | grep -q "^${forbidden}="
          done
          echo "RUNTIME_ENV_NAMES=DISPLAY,HOME,JD_BROWSER_CAPTURE_TOKEN,JD_BROWSER_CONTROL_TOKEN,JD_BROWSER_VIEWER_SIGNING_KEY,JD_PROFILE_ROOT,JD_SESSION_ARCHIVE_ROOT,JD_SESSION_MASTER_KEY,PORT"

          for _ in $(seq 1 30); do
            curl --silent --fail "http://127.0.0.1:$novnc_port/vnc.html" >/dev/null && break
            sleep 1
          done
          python - "$novnc_port" <<'PY'
          import socket
          import sys

          port = int(sys.argv[1])
          with socket.create_connection(("127.0.0.1", port), timeout=5) as connection:
              request = (
                  "GET /websockify HTTP/1.1\r\n"
                  "Host: 127.0.0.1\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  "Sec-WebSocket-Protocol: binary\r\n\r\n"
              )
              connection.sendall(request.encode("ascii"))
              response = connection.recv(4096)
          assert b" 101 " in response.split(b"\r\n", 1)[0], response[:200]
          print("RUNTIME_NOVNC_WEBSOCKET=PASS")
          PY

          docker restart "$container" >/dev/null
          runtime_port="$(docker port "$container" 8787/tcp | awk -F: 'END {print $NF}')"
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "x-internal-token: $control_token" \
              "http://127.0.0.1:$runtime_port/internal/jd-browser/health" || true)"
            test "$status" = 200 && break
            sleep 1
          done
          test "$status" = 200
          echo "RUNTIME_RESTART=PASS"

      - name: Run tests
        run: |
          bash -n ops/r297_workbench_deploy.sh
          python -m pytest -v tests/ --junitxml=/tmp/pytest-results.xml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result_path = Path("/tmp/pytest-results.xml")
          root = ET.parse(result_path).getroot()
          if root.tag == "testsuite":
              suites = [root]
          elif all(name in root.attrib for name in ("tests", "failures", "errors", "skipped")):
              suites = [root]
          else:
              suites = root.findall("testsuite")
          totals = {
              name: sum(int(suite.attrib.get(name, "0")) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          assert totals == {
              "tests": 1793,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }, totals
          print("CI_PYTEST_RESULT=1793_PASS/0_SKIP/0_FAIL/0_ERROR")
          PY

      - name: Verify CI Redis queue and lock residue
        if: always()
        run: |
          python - <<'PY'
          import os

          import redis

          client = redis.Redis.from_url(os.environ["REDIS_URL"], decode_responses=True)
          assert client.ping() is True
          assert client.llen("tiantong:employee:tianshang:execution") == 0
          assert client.llen("tiantong:execution:tasks") == 0
          assert list(client.scan_iter("tiantong:execution:lock:*")) == []
          PY

      - name: Remove temporary backend and worker test images
        if: always()
        run: |
          test -z "$(docker ps --all --quiet --filter "ancestor=$S12_BACKEND_IMAGE")"
          test -z "$(docker ps --all --quiet --filter "ancestor=$S12_WORKER_IMAGE")"
          test -z "$(docker ps --all --quiet --filter "ancestor=$S12_JD_RUNTIME_IMAGE")"
          docker image rm "$S12_BACKEND_IMAGE" "$S12_WORKER_IMAGE" "$S12_JD_RUNTIME_IMAGE"

      - name: Validate production compose
        env:
          PRODUCTION_ENV_FILE: .env.production.example
        run: |
          test "$PRODUCTION_ENV_FILE" = ".env.production.example"
          test -f "$PRODUCTION_ENV_FILE"
          git ls-files --error-unmatch -- "$PRODUCTION_ENV_FILE" >/dev/null
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SOURCE_SHA")"
          export RELEASE_COMMIT="$RELEASE_SOURCE_SHA"
          export JD_BROWSER_CAPTURE_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export JD_BROWSER_CONTROL_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export JD_BROWSER_VIEWER_SIGNING_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export JD_SESSION_MASTER_KEY="$(python -c 'import base64; print(base64.b64encode(bytes(range(32))).decode())')"
          test -n "$SOURCE_DATE_EPOCH"
          for key in POSTGRES_DB POSTGRES_ADMIN_USER POSTGRES_ADMIN_PASSWORD REDIS_PASSWORD TLS_CERT_PATH TLS_KEY_PATH; do
            grep -Eq "^${key}=.+" "$PRODUCTION_ENV_FILE"
          done
          docker compose \
            --env-file "$PRODUCTION_ENV_FILE" \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t tiantong-ai-cloud-frontend:${{ github.sha }} .
