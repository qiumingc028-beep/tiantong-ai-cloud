name: R297 isolated PostgreSQL candidate validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/r297-cloud-integration
  pull_request:
    branches:
      - codex/r297-cloud-integration

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      APP_ENV: test
      RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      V2_ALPHA_POSTGRES_ADMIN_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/postgres
      STORE_AUTHZ_POSTGRES_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked application requirements
        run: python -m pip install -r requirements.txt
      - name: Restore actual application schema and business data
        env:
          R297_RESTORE_ACCEPTANCE_ISOLATED: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: ci
          PGPASSWORD: ci
        run: bash ops/r297_database_restore_contract_test.sh
      - name: Run complete selected contracts against PostgreSQL 16
        id: postgres_tests
        timeout-minutes: 25
        run: |
          set +x
          trap 'unset CI_PYTEST_IDENTITY_KEY R297_REDACT_EXACT_ENV_NAMES' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          if ! CI_PYTEST_IDENTITY_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))' 2>/dev/null)" || [[ ${#CI_PYTEST_IDENTITY_KEY} -lt 64 ]]; then
            echo "CI_PYTEST_IDENTITY_KEY_MISSING"
            exit 1
          fi
          echo "::add-mask::$CI_PYTEST_IDENTITY_KEY"
          export CI_PYTEST_IDENTITY_KEY
          export R297_REDACT_EXACT_ENV_NAMES=CI_PYTEST_IDENTITY_KEY
          work="$(mktemp -d /tmp/r297-postgres-work.XXXXXX)"
          export CI_PYTEST_COLLECTION_MANIFEST="$work/collected-nodeids.json"
          isolate=()
          if [[ "$EUID" != 0 ]]; then
            isolate=(sudo -n --preserve-env=APP_ENV,RELEASE_SOURCE_SHA,V2_ALPHA_POSTGRES_ADMIN_URL,STORE_AUTHZ_POSTGRES_URL,REDIS_URL,CI_PYTEST_IDENTITY_KEY,R297_REDACT_EXACT_ENV_NAMES,CI_PYTEST_COLLECTION_MANIFEST,GITHUB_ACTIONS,PYTHONPATH,PYTHONDONTWRITEBYTECODE,PYTEST_DISABLE_PLUGIN_AUTOLOAD)
          fi
          set +e
          env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
            "${isolate[@]}" "$(command -v python)" ops/r297_candidate_pytest.py "$work" \
            -m pytest -q --tb=short --show-capture=no \
            -p ops.ci_pytest_gate --junitxml="$work/junit.xml" \
            tests/test_r297_acceptance_status.py \
            tests/test_r297_owner_audit_saga_contract.py \
            tests/test_r297_owner_operation_causality.py \
            tests/test_r297_owner_unknown_recovery.py \
            tests/test_r297_owner_login_session_contract.py \
            tests/test_r297_jd_session_contract_vectors.py \
            tests/test_r291_jd_workbench_cloud.py \
            tests/test_r297_reliable_queue.py \
            tests/test_r297_dataset_validation.py \
            tests/test_r297_dataset_required_fields.py \
            tests/test_r297_empty_dataset_evidence.py \
            tests/test_r297_runtime_trust_boundaries.py \
            tests/test_r297_jd_collector_business_idempotency.py \
            tests/test_r297_reliable_queue_postgresql.py \
            tests/test_r297_jd_workbench_hash_uniqueness_migration.py \
            tests/test_r297_jd_business_uniqueness_migration.py >"$work/pytest.log" 2>&1
          result=$?
          set -e
          # Only normal pytest completion may publish; cancellation/internal errors stay private.
          if [[ "$result" != 0 && "$result" != 1 ]]; then
            echo "POSTGRES_TEST_EXECUTION_INCOMPLETE"
            exit "$result"
          fi
          publish="$(mktemp -d /tmp/r297-postgres-publish.XXXXXX)"
          set +e
          env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
            python - "$work" "$publish" <<'PY'
          import sys
          import os
          from contextlib import ExitStack
          from io import BytesIO
          from pathlib import Path
          from ops.ci_pytest_gate import (
              _contains_identity_key, _stable_file_bytes, validate_report,
              _open_owned_directory, _close_owned_directory, _write_owned_file, _path_identity,
          )
          from ops.r297_ci_redact import redact_content
          try:
              work, publish = map(Path, sys.argv[1:])
              names = {'junit.xml', 'pytest.log', 'collected-nodeids.json', 'collected-nodeids.display.json'}
              with ExitStack() as handles:
                  source = _open_owned_directory(work)
                  handles.callback(_close_owned_directory, source)
                  target = _open_owned_directory(publish)
                  handles.callback(_close_owned_directory, target)
                  if set(os.listdir(source['fd'])) != names or os.listdir(target['fd']):
                      raise ValueError('unexpected file set')
                  # Pin the source directory; each file is opened once with O_NOFOLLOW.
                  snapshot = {name: _stable_file_bytes(Path(f"/proc/self/fd/{source['fd']}/{name}"))
                              for name in sorted(names)}
                  safe = {name: redact_content(payload.decode('utf-8', errors='replace')).encode('utf-8')
                          for name, payload in snapshot.items()}
                  if any(_contains_identity_key(payload) for payload in safe.values()):
                      raise ValueError('identity contamination')

                  class ManifestSnapshot:
                      # Adapt immutable bytes to the existing validator's read_text interface.
                      def read_text(self, **kwargs):
                          return safe['collected-nodeids.json'].decode('utf-8')

                  validation_exit = 0
                  try:
                      validate_report(BytesIO(safe['junit.xml']), ManifestSnapshot(), minimum=1)
                  except ValueError as exc:
                      if str(exc) != 'PYTEST_NOT_ALL_PASS':
                          raise
                      # Distinct from Python's default startup/import failure code 1.
                      validation_exit = 10
                  for name, payload in safe.items():
                      _write_owned_file(target, name, payload)
                  # The publication must still be the files and exact bytes just checked.
                  if (_path_identity(publish) != target['identity']
                          or set(os.listdir(target['fd'])) != names):
                      raise ValueError('publication directory changed')
                  for name, payload in safe.items():
                      item = os.stat(name, dir_fd=target['fd'], follow_symlinks=False)
                      if ((item.st_dev, item.st_ino, item.st_mode) != target['files'][name]
                              or _stable_file_bytes(Path(f"/proc/self/fd/{target['fd']}/{name}")) != payload):
                          raise ValueError('publication content changed')
                      after = os.stat(name, dir_fd=target['fd'], follow_symlinks=False)
                      stamp = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      if stamp(after) != stamp(item):
                          raise ValueError('publication identity changed')
                  if _path_identity(publish) != target['identity']:
                      raise ValueError('publication directory changed')
          except BaseException:
              print('POSTGRES_REPORT_PUBLICATION_FAILED')
              raise SystemExit(2) from None
          raise SystemExit(validation_exit)
          PY
          validation_result=$?
          set -e
          if [[ "$validation_result" != 0 && "$validation_result" != 10 ]]; then
            exit 1
          fi
          if [[ "$validation_result" == 10 ]]; then result=1; fi
          unset CI_PYTEST_IDENTITY_KEY R297_REDACT_EXACT_ENV_NAMES
          echo "publish_path=$publish" >> "$GITHUB_OUTPUT"
          echo "publication_ready=true" >> "$GITHUB_OUTPUT"
          echo 'RELEASE_APPROVAL=NOT_GRANTED'
          exit "$result"
      - name: Upload actual database test results
        if: ${{ !cancelled() && steps.postgres_tests.outputs.publication_ready == 'true' && steps.postgres_tests.outputs.publish_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: r297-postgres-${{ env.RELEASE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.postgres_tests.outputs.publish_path }}
          if-no-files-found: error
          retention-days: 14
