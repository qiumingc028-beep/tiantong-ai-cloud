name: R297 Windows Workbench Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/r297-cloud-integration
      - codex/r297-jd-multistore-autosync
    paths:
      - desktop/jd-workbench/**
      - tests/test_r291_jd_workbench_client_static.py
      - tests/test_r297_jd_workbench_auto_sync_static.py
      - tests/test_r297_windows_release_gate.py
      - ops/r297_windows_acceptance.ps1
      - ops/r297_windows_event_signer.py
      - ops/r297_evidence_preflight.py
      - ops/r297_evidence_events.py
      - .github/workflows/r291-windows-workbench.yml
  push:
    branches:
      - codex/r297-cloud-integration
      - codex/r297-jd-multistore-autosync
      - codex/r297-release-gates
    paths:
      - desktop/jd-workbench/**
      - tests/test_r291_jd_workbench_client_static.py
      - tests/test_r297_jd_workbench_auto_sync_static.py
      - tests/test_r297_windows_release_gate.py
      - ops/r297_windows_acceptance.ps1
      - ops/r297_windows_event_signer.py
      - ops/r297_evidence_preflight.py
      - ops/r297_evidence_events.py
      - .github/workflows/r291-windows-workbench.yml

permissions:
  contents: read

jobs:
  build-windows:
    environment: r297-controlled-canary
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/jd-workbench

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/jd-workbench/package-lock.json

      - name: Set up Python for signed evidence
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run syntax and security policy checks
        run: npm run check

      - name: Build Windows x64 NSIS installer and portable ZIP
        run: npm run dist:win

      - name: Verify packaged Chromium runtime
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path dist/win-unpacked -Filter *.exe -File)
          if ($executables.Count -ne 1) {
            throw "Expected one packaged Electron executable, found $($executables.Count)"
          }

          $env:ELECTRON_RUN_AS_NODE = '1'
          $infoPath = Join-Path (Resolve-Path dist) 'chromium-info.json'
          $probePath = Join-Path (Resolve-Path dist) 'chromium-probe.cjs'
          'const fs=require("node:fs");fs.writeFileSync(process.argv[2],JSON.stringify({chromiumExecutablePath:process.execPath,chromiumVersion:process.versions.chrome,electronVersion:process.versions.electron}))' |
            Set-Content -LiteralPath $probePath -Encoding utf8NoBOM
          $probe = Start-Process -FilePath $executables[0].FullName -ArgumentList @($probePath, $infoPath) -Wait -PassThru
          Remove-Item -LiteralPath $probePath
          if ($probe.ExitCode -ne 0) {
            throw "Packaged Chromium runtime probe failed with exit code $($probe.ExitCode)"
          }
          $info = Get-Content -Raw -LiteralPath $infoPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($info.chromiumVersion)) {
            throw 'Packaged Chromium version is missing'
          }
          $expectedPath = [IO.Path]::GetFullPath($executables[0].FullName)
          $actualPath = [IO.Path]::GetFullPath($info.chromiumExecutablePath)
          if (-not [string]::Equals($actualPath, $expectedPath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Packaged Chromium path mismatch: expected $expectedPath, got $actualPath"
          }
          Write-Host "Packaged Chromium executable: $actualPath"
          Write-Host "Packaged Chromium version: $($info.chromiumVersion)"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $expectedNames = @(
            "TiantongAI-JD-Workbench-$version-x64.exe",
            "TiantongAI-JD-Workbench-$version-x64.zip"
          )
          $actualNames = @($files.Name | Sort-Object)
          if ($files.Count -ne 2 -or (Compare-Object ($expectedNames | Sort-Object) $actualNames)) {
            throw "Expected one NSIS installer and one portable ZIP named $($expectedNames -join ', '); found $($actualNames -join ', ')"
          }
          $lines = foreach ($file in $files | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Materialize protected Windows evidence trust material
        shell: pwsh
        working-directory: .
        env:
          R297_WINDOWS_RUNNER_PRIVATE_KEY_BASE64: ${{ secrets.R297_WINDOWS_RUNNER_PRIVATE_KEY_BASE64 }}
          R297_EVIDENCE_TRUST_MANIFEST_BASE64: ${{ secrets.R297_EVIDENCE_TRUST_MANIFEST_BASE64 }}
          R297_EVIDENCE_TRUST_MANIFEST_SHA256: ${{ secrets.R297_EVIDENCE_TRUST_MANIFEST_SHA256 }}
        run: |
          if (-not $env:R297_WINDOWS_RUNNER_PRIVATE_KEY_BASE64 -or
              -not $env:R297_EVIDENCE_TRUST_MANIFEST_BASE64 -or
              $env:R297_EVIDENCE_TRUST_MANIFEST_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'R297_WINDOWS_PROTECTED_MATERIAL_MISSING'
          }
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            throw 'R297_WINDOWS_OPENSSL_MISSING'
          }
          $trustDirectory = Join-Path $env:ProgramData 'TiantongAI'
          $trustPath = Join-Path $trustDirectory 'r297-evidence-trust-manifest.json'
          $trustSidecar = "$trustPath.sha256"
          $privateKeyPath = Join-Path $env:RUNNER_TEMP 'r297-windows-runner-private-key.pem'
          New-Item -ItemType Directory -Force -Path $trustDirectory | Out-Null
          [IO.File]::WriteAllBytes($privateKeyPath, [Convert]::FromBase64String($env:R297_WINDOWS_RUNNER_PRIVATE_KEY_BASE64))
          [IO.File]::WriteAllBytes($trustPath, [Convert]::FromBase64String($env:R297_EVIDENCE_TRUST_MANIFEST_BASE64))
          $actualTrustHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $trustPath).Hash.ToLowerInvariant()
          if ($actualTrustHash -cne $env:R297_EVIDENCE_TRUST_MANIFEST_SHA256) {
            throw 'R297_WINDOWS_TRUST_MANIFEST_DIGEST_MISMATCH'
          }
          [IO.File]::WriteAllText(
            $trustSidecar,
            "$actualTrustHash  r297-evidence-trust-manifest.json`n",
            [Text.Encoding]::ASCII
          )
          foreach ($path in @($privateKeyPath, $trustPath, $trustSidecar)) {
            & icacls $path /inheritance:r /grant:r "$($env:USERNAME):(R)" 'SYSTEM:(R)' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'R297_WINDOWS_PROTECTED_MATERIAL_ACL_FAILED' }
            (Get-Item -LiteralPath $path).IsReadOnly = $true
          }
          "R297_WINDOWS_RUNNER_PRIVATE_KEY_PATH=$privateKeyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate real Windows process acceptance evidence
        shell: pwsh
        working-directory: .
        env:
          R297_WINDOWS_CANARY_BACKEND_HTTPS_URL: ${{ secrets.R297_WINDOWS_CANARY_BACKEND_HTTPS_URL }}
          R297_WINDOWS_CANARY_PAIRING_ISSUER_BEARER: ${{ secrets.R297_WINDOWS_CANARY_PAIRING_ISSUER_BEARER }}
          R297_WINDOWS_CANARY_SERVER_CERTIFICATE_BASE64: ${{ secrets.R297_WINDOWS_CANARY_SERVER_CERTIFICATE_BASE64 }}
          R297_EVIDENCE_NAMESPACE: ${{ vars.R297_EVIDENCE_NAMESPACE }}
          R297_EVIDENCE_TENANT_ID: ${{ vars.R297_EVIDENCE_TENANT_ID }}
          R297_EVIDENCE_COMPANY_ID: ${{ vars.R297_EVIDENCE_COMPANY_ID }}
          R297_EVIDENCE_STORE_ID: ${{ vars.R297_EVIDENCE_STORE_ID }}
          R297_EVIDENCE_PLATFORM: jd
          APP_ENV: acceptance
        run: |
          python -m ops.r297_evidence_preflight --role windows_runner
          ./ops/r297_windows_acceptance.ps1 `
            -DistDirectory desktop/jd-workbench/dist `
            -OutputDirectory desktop/jd-workbench/dist/acceptance

      - name: Upload internal acceptance artifact
        uses: actions/upload-artifact@v7
        with:
          name: tiantong-ai-jd-workbench-r297-windows
          path: |
            desktop/jd-workbench/dist/*.exe
            desktop/jd-workbench/dist/*.zip
            desktop/jd-workbench/dist/SHA256SUMS.txt
            desktop/jd-workbench/dist/chromium-info.json
            desktop/jd-workbench/dist/acceptance/R297_WINDOWS_ACCEPTANCE_EVIDENCE.json
            desktop/jd-workbench/dist/acceptance/R297_WINDOWS_ACCEPTANCE_EVIDENCE.json.sha256
            desktop/jd-workbench/dist/acceptance/R297_WINDOWS_ELECTRON_EXIT_EVENT.json
            desktop/jd-workbench/dist/acceptance/R297_WINDOWS_ELECTRON_EXIT_EVENT.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove protected Windows evidence trust material
        if: always()
        shell: pwsh
        working-directory: .
        run: |
          $paths = @(
            (Join-Path $env:RUNNER_TEMP 'r297-windows-runner-private-key.pem'),
            (Join-Path $env:ProgramData 'TiantongAI/r297-evidence-trust-manifest.json'),
            (Join-Path $env:ProgramData 'TiantongAI/r297-evidence-trust-manifest.json.sha256')
          )
          foreach ($path in $paths) {
            if ($path -and (Test-Path -LiteralPath $path)) {
              & icacls $path /grant:r "$($env:USERNAME):(F)" | Out-Null
              (Get-Item -LiteralPath $path).IsReadOnly = $false
              Remove-Item -Force -LiteralPath $path
            }
          }
