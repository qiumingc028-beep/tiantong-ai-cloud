<!doctype html>
<html lang="zh-CN" data-required-menu="menu.ai_assets">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI素材中心 - 天统AI云中台</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--primary:#2563eb;--good:#15803d;--bad:#b91c1c;--warn:#92400e}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;color:#cbd5e1;padding:18px 14px}
    .brand{height:56px;color:white;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08)}
    .menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}.menu a.active,.menu a:hover{background:#1f2937;color:white}
    .topbar{min-height:64px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:16px}
    .top-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px}.ok{color:var(--good)}
    .content{padding:24px;max-width:1180px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.sub,.muted{color:var(--muted);line-height:1.7}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:600}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:10px;background:white}
    .drop-zone{border:2px dashed #94a3b8;border-radius:10px;padding:32px 20px;text-align:center;background:#f8fafc;transition:.15s}.drop-zone.dragging{border-color:var(--primary);background:#eff6ff}.drop-zone button{margin-top:12px}
    button{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;cursor:pointer}button.primary{background:var(--primary);border-color:var(--primary);color:white;font-weight:600}button:disabled{cursor:not-allowed;opacity:.55}
    .actions{display:flex;justify-content:flex-end;margin-top:16px}.state{border:1px solid var(--line);background:#f8fafc;color:var(--muted);border-radius:8px;padding:11px 13px;margin-top:16px}.state.success{border-color:#bbf7d0;background:#f0fdf4;color:var(--good)}.state.error{border-color:#fecaca;background:#fef2f2;color:var(--bad)}.state.uploading{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}
    .preview-grid,.asset-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}.preview,.asset{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:white}.preview img{width:100%;height:130px;object-fit:cover;background:#e2e8f0}.preview-body,.asset{padding:11px}.preview-name,.asset-name{font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);padding:18px 0}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:13px;color:var(--muted)}.hidden{display:none}.auth-pending .sidebar,.auth-pending main{visibility:hidden}
    @media(max-width:760px){.app{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.content{padding:16px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="auth-pending">
  <div class="app">
    <aside class="sidebar"><div class="brand">天统AI云中台</div><nav id="menu" class="menu"></nav></aside>
    <main>
      <header class="topbar"><strong>AI素材中心</strong><div class="top-meta"><span id="currentTime" class="pill"></span><span id="systemStatus" class="pill">系统检查中</span><span id="me" class="pill">加载中</span><button data-rbac-action="ai-assets-logout">退出登录</button></div></header>
      <section class="content">
        <div class="card">
          <h1>上传商品素材</h1>
          <div class="sub">为店铺商品上传图片素材。仅支持 JPEG、PNG、WEBP，最多 9 张，单张不超过 10 MiB。</div>
          <form id="uploadForm">
            <div class="form-grid">
              <div class="field"><label for="shopSelect">店铺</label><select id="shopSelect" name="shop_id" required disabled><option value="">正在加载可用店铺…</option></select></div>
              <div class="field"><label for="productName">商品名称</label><input id="productName" name="product_name" required maxlength="120" autocomplete="off" placeholder="请输入商品名称"></div>
            </div>
            <input id="fileInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple>
            <div id="dropZone" class="drop-zone" tabindex="0">
              <strong>拖放商品图片到这里</strong>
              <div class="muted">或从设备选择文件</div>
              <button id="pickButton" type="button" disabled data-rbac-disabled-entry data-rbac-action="ai-assets-pick">选择图片</button>
            </div>
            <div id="previewGrid" class="preview-grid"></div>
            <div class="actions"><button id="uploadButton" class="primary" type="submit" disabled data-rbac-disabled-entry>上传素材</button></div>
          </form>
          <div id="uploadState" class="state" role="status" aria-live="polite">请选择店铺并添加商品图片。</div>
        </div>
        <div class="card">
          <div class="section-head"><h2>已上传素材</h2><span id="assetCount" class="count"></span></div>
          <div class="muted">刷新页面后仍会从服务器加载已保存的素材记录。</div>
          <div id="assetList" class="asset-list"><div class="empty">正在加载素材…</div></div>
        </div>
      </section>
    </main>
  </div>

  <script type="text/plain" data-rbac-protected>
    const MAX_FILES=9;
    const MAX_FILE_SIZE=10*1024*1024;
    const ALLOWED_TYPES=new Set(['image/jpeg','image/png','image/webp']);
    let selectedFiles=[];
    let previewUrls=[];
    let uploadInFlight=false;

    function setState(message,type=''){
      uploadState.textContent=message;
      uploadState.className=`state ${type}`.trim();
    }
    function formatBytes(value){
      if(value>=1024*1024)return `${(value/(1024*1024)).toFixed(1)} MiB`;
      return `${Math.max(1,Math.round(value/1024))} KiB`;
    }
    async function api(url,options={}){
      const response=await fetch(url,{credentials:'include',...options});
      if(response.status===401){location.href='/login.html';throw new Error('登录状态已失效')}
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.detail||'请求失败');
      return data;
    }
    function renderShops(shops){
      shopSelect.replaceChildren();
      const placeholder=document.createElement('option');
      placeholder.value='';
      placeholder.textContent=shops.length?'请选择店铺':'暂无可用店铺';
      shopSelect.appendChild(placeholder);
      for(const shop of shops){
        const option=document.createElement('option');
        option.value=String(shop.id);
        option.textContent=`${shop.store_name}（${shop.store_code}）`;
        shopSelect.appendChild(option);
      }
      shopSelect.disabled=!shops.length;
    }
    async function loadShops(){
      const data=await api('/api/ai-products/shops');
      renderShops(Array.isArray(data.shops)?data.shops:[]);
    }
    function clearPreviewUrls(){
      for(const url of previewUrls)URL.revokeObjectURL(url);
      previewUrls=[];
    }
    function renderPreviews(){
      clearPreviewUrls();
      previewGrid.replaceChildren();
      for(const file of selectedFiles){
        const card=document.createElement('div');card.className='preview';
        const image=document.createElement('img');
        const url=URL.createObjectURL(file);previewUrls.push(url);
        image.src=url;image.alt=file.name;
        const body=document.createElement('div');body.className='preview-body';
        const name=document.createElement('div');name.className='preview-name';name.textContent=file.name;
        const meta=document.createElement('div');meta.className='meta';meta.textContent=formatBytes(file.size);
        body.append(name,meta);card.append(image,body);previewGrid.appendChild(card);
      }
    }
    function validateFiles(files){
      if(!files.length)return '请选择至少 1 张图片';
      if(files.length>MAX_FILES)return '每次最多选择 9 张图片';
      for(const file of files){
        if(!ALLOWED_TYPES.has(file.type))return `${file.name}：仅支持 JPEG、PNG、WEBP`;
        if(file.size>MAX_FILE_SIZE)return `${file.name}：单张不能超过 10 MiB`;
        if(file.size===0)return `${file.name}：文件不能为空`;
      }
      return '';
    }
    function chooseFiles(files){
      const next=Array.from(files);
      const error=validateFiles(next);
      if(error){selectedFiles=[];renderPreviews();setState(error,'error');return}
      selectedFiles=next;renderPreviews();setState(`已选择 ${selectedFiles.length} 张图片`);
    }
    function handleDroppedFiles(event){
      event.preventDefault();
      dropZone.classList.remove('dragging');
      chooseFiles(event.dataTransfer.files);
    }
    function renderAssets(assets){
      assetList.replaceChildren();
      assetCount.textContent=`共 ${assets.length} 个`;
      if(!assets.length){
        const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无已上传素材';
        assetList.appendChild(empty);return;
      }
      for(const asset of assets){
        const card=document.createElement('div');card.className='asset';
        const name=document.createElement('div');name.className='asset-name';name.textContent=asset.original_filename;
        const meta=document.createElement('div');meta.className='meta';
        meta.textContent=`店铺 ${asset.shop_id} · ${formatBytes(asset.size_bytes)} · ${asset.status==='ready'?'上传成功':asset.status}`;
        card.append(name,meta);assetList.appendChild(card);
      }
    }
    async function loadAssets(){
      try{
        const data=await api('/api/ai-products/assets');
        renderAssets(Array.isArray(data.assets)?data.assets:[]);
      }catch(error){
        assetList.replaceChildren();
        const failed=document.createElement('div');failed.className='state error';failed.textContent=`素材加载失败：${error.message}`;
        assetList.appendChild(failed);
      }
    }
    async function uploadAssets(event){
      if(event)event.preventDefault();
      if(uploadInFlight)return;
      if(!uploadForm.reportValidity())return;
      if(!productName.value.trim()){setState('请输入商品名称','error');productName.focus();return}
      const error=validateFiles(selectedFiles);
      if(error){setState(error,'error');return}
      uploadInFlight=true;uploadButton.disabled=true;setState('正在上传，请勿重复提交…','uploading');
      const body=new FormData();
      body.append('shop_id',shopSelect.value);
      body.append('product_name',productName.value.trim());
      for(const file of selectedFiles)body.append('files',file,file.name);
      try{
        await api('/api/ai-products/assets',{method:'POST',body});
        setState('上传成功，素材已保存。','success');
        selectedFiles=[];fileInput.value='';renderPreviews();
        await loadAssets();
      }catch(error){
        setState(`上传失败：${error.message}`,'error');
      }finally{
        uploadInFlight=false;uploadButton.disabled=false;
      }
    }
    async function init(){
      pickButton.disabled=false;
      uploadButton.disabled=false;
      currentTime.textContent=new Date().toLocaleString('zh-CN',{hour12:false});
      setInterval(()=>{currentTime.textContent=new Date().toLocaleString('zh-CN',{hour12:false})},1000);
      const identity=await api('/api/me');me.textContent=`${identity.display_name} · ${identity.role_label||identity.role}`;
      const health=await fetch('/api/health',{credentials:'include'}).then(response=>response.ok?response.json():null).catch(()=>null);
      systemStatus.textContent=health?`服务器正常 · 数据库 ${health.database} · Redis ${health.redis}`:'系统状态获取失败';
      if(health)systemStatus.classList.add('ok');
      try{await loadShops()}catch(error){renderShops([]);setState(`店铺加载失败：${error.message}`,'error')}
      await loadAssets();
    }

    fileInput.addEventListener('change',event=>chooseFiles(event.target.files));
    dropZone.addEventListener('dragover',event=>{event.preventDefault();dropZone.classList.add('dragging')});
    dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragging'));
    dropZone.addEventListener('drop',handleDroppedFiles);
    uploadForm.addEventListener('submit',uploadAssets);
    window.addEventListener('pagehide',clearPreviewUrls);
    init();
  </script>
  <script type="text/plain" data-rbac-protected>
    TiantongRbac.bindActions({
      "ai-assets-logout":["click",function(event){return TiantongRbac.logout();}],
      "ai-assets-pick":["click",function(event){fileInput.click();}]
    });
  </script>
</body>
</html>
