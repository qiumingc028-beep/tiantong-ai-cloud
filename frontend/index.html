<!doctype html>
<html lang="zh-CN" data-required-menu="menu.dashboard">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老板驾驶舱 - 天统AI</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--brand:#0f766e;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.auth-pending .app{visibility:hidden}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ffffff18}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.main{min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px}.top-meta,.filters,.section-head,.item-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section-head,.item-row{justify-content:space-between}.section-head h2{margin:0}.pill,.badge{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:13px}.content{padding:24px}.hero{background:linear-gradient(135deg,#0f172a,#0f766e);color:#fff;border-radius:8px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#d1fae5}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.approval-card{margin-bottom:16px}.list{display:grid;gap:10px;margin-top:12px}.item{border:1px solid var(--line);border-radius:8px;padding:12px}.muted{color:var(--muted);font-size:13px}details{margin-top:8px}summary{color:var(--brand);cursor:pointer;font-weight:700}.filters{margin-bottom:16px}.filters select,.filters input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff}.filters select{min-width:220px}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px}.label{color:var(--muted);font-size:13px}.num{font-size:27px;font-weight:800;color:var(--brand);margin:8px 0}.state{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px;color:var(--muted);background:#fff}.state.ok{background:#f0fdf4;color:var(--good)}.state.error{background:#fef2f2;color:var(--bad)}@media(max-width:1000px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.content{padding:16px}.topbar{align-items:flex-start;gap:10px;flex-direction:column}.summary{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI</div><nav id="menu" class="menu"></nav></aside><main class="main">
  <header class="topbar"><strong>老板驾驶舱</strong><div class="top-meta"><span id="systemStatus" class="pill">系统检查中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="dashboard-logout">退出登录</button></div></header>
  <section class="content">
    <div class="hero"><h1>老板驾驶舱</h1><p>仅展示已经写入数据库的内部测试经营数据，不使用静态或推算数字。</p></div>
    <div class="filters"><label>开始 <input id="dateFrom" type="date"></label><label>结束 <input id="dateTo" type="date"></label><label>店铺 <select id="storeSelect"><option value="">全部有权限店铺</option></select></label><button data-rbac-action="dashboard-query">刷新经营数据</button></div>
    <div id="pageState" class="state">正在加载数据库经营数据...</div>
    <section class="card approval-card">
      <div class="section-head"><h2>待老板确认</h2><span id="approvalCount" class="badge">加载中</span></div>
      <div id="approvalList" class="list"><div class="muted">正在读取审批事项...</div></div>
    </section>
    <section class="summary">
      <div class="card"><div class="label">销售额</div><div id="sales" class="num">¥0</div><div class="label">数据库记录</div></div>
      <div class="card"><div class="label">利润</div><div id="profit" class="num">¥0</div><div class="label">数据库记录</div></div>
      <div class="card"><div class="label">订单量</div><div id="orders" class="num">0</div><div class="label">数据库记录</div></div>
      <div class="card"><div class="label">广告消耗</div><div id="adSpend" class="num">¥0</div><div class="label">数据库记录</div></div>
      <div class="card"><div class="label">访客</div><div id="visitors" class="num">0</div><div class="label">数据库记录</div></div>
      <div class="card"><div class="label">ROI</div><div id="roi" class="num">0</div><div class="label">销售额 / 广告消耗</div></div>
    </section>
  </section>
</main></div>
<script type="text/plain" data-rbac-protected>
  const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=value=>'¥'+Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  async function api(url){const response=await fetch(url,{credentials:'include'});if(response.status===401){location.href='/login.html';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  function queryString(){const params=new URLSearchParams();if($('dateFrom').value)params.set('date_from',$('dateFrom').value);if($('dateTo').value)params.set('date_to',$('dateTo').value);if($('storeSelect').value)params.set('store_id',$('storeSelect').value);return params.toString()}
  async function loadStores(){const stores=await api('/api/stores');$('storeSelect').innerHTML='<option value="">全部有权限店铺</option>'+stores.filter(store=>store.active).map(store=>`<option value="${store.id}">${escapeHtml(store.store_name)}</option>`).join('')}
  async function loadDashboard(){try{$('pageState').className='state';$('pageState').textContent='正在读取数据库经营数据...';const data=await api('/api/owner/dashboard?'+queryString());$('sales').textContent=money(data.today_sales);$('profit').textContent=money(data.today_profit);$('orders').textContent=data.orders;$('adSpend').textContent=money(data.ad_spend);$('visitors').textContent=data.visitors;$('roi').textContent=Number(data.roi||0).toLocaleString('zh-CN',{maximumFractionDigits:2});$('pageState').className='state ok';$('pageState').textContent='经营数据已从数据库刷新。'}catch(error){$('pageState').className='state error';$('pageState').textContent=error.message}}
  function renderApprovalCenter(data){const items=Array.isArray(data.items)?data.items.slice(0,6):[];const count=Number.isFinite(Number(data.pending_count))?Number(data.pending_count):items.length;$('approvalCount').textContent=`${count} 项`;$('approvalList').innerHTML=items.length?items.map(item=>`<div class="item"><div class="item-row"><strong>${escapeHtml(item.title||'未命名审批事项')}</strong><span class="badge">${escapeHtml(item.risk_level||'normal')}</span></div><div class="muted">${escapeHtml(item.source_ai_employee||'来源未提供')} · ${escapeHtml(item.status||'状态未提供')}</div><details><summary>查看</summary><p>${escapeHtml(item.description||'暂无说明')}</p><div class="muted">AI建议：${escapeHtml(item.recommendation||'暂无建议')}</div></details></div>`).join(''):'<div class="muted">暂无待老板确认事项。</div>'}
  async function loadApprovalCenter(){try{renderApprovalCenter(await api('/api/approval-center/pending'))}catch(error){$('approvalCount').textContent='不可用';$('approvalList').innerHTML='<div class="state error">暂无权限访问审批中心或服务暂不可用。</div>'}}
  async function init(){const access=await TiantongRbac.ready;if(!access.allowed)return;$('userInfo').textContent=`${access.user.display_name} · ${access.user.role_label||access.user.role}`;void loadApprovalCenter();const today=new Date().toISOString().slice(0,10);$('dateFrom').value=today;$('dateTo').value=today;const health=await api('/api/health');$('systemStatus').textContent=health.status==='running'&&health.database?'后端与数据库健康':'后端异常';await loadStores();await loadDashboard()}
  init().catch(error=>{$('pageState').className='state error';$('pageState').textContent=error.message});
</script>
<script type="text/plain" data-rbac-protected>TiantongRbac.bindActions({
  "dashboard-logout":["click",function(event){return TiantongRbac.logout();}],
  "dashboard-query":["click",function(event){return loadDashboard();}]
});</script>
</body></html>
