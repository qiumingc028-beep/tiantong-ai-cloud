<!doctype html>
<html lang="zh-CN" data-required-menu="menu.jd_data">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>经营中心 - 天统AI</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--brand:#0f766e;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.auth-pending .app{visibility:hidden}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ffffff18}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.main{min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px}.top-meta,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:13px}.content{padding:24px}.card,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:8px}.card{padding:16px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}h1{margin:0 0 6px}.muted{color:var(--muted)}select,input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;margin:16px 0}.num{font-size:24px;font-weight:800;color:var(--brand);margin-top:7px}.state{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;color:var(--muted);margin-bottom:12px}.state.error{background:#fef2f2;color:var(--bad)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc;color:#475569}.money{font-weight:700;color:var(--brand)}@media(max-width:1000px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.content{padding:16px}.topbar,.page-head{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI</div><nav id="menu" class="menu"></nav></aside><main class="main">
  <header class="topbar"><strong>经营中心</strong><div class="top-meta"><span id="systemStatus" class="pill">系统检查中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="business-logout">退出登录</button></div></header>
  <section class="content">
    <div class="page-head"><div><h1>经营中心</h1><div class="muted">查询已导入数据库的真实经营数据</div></div><div class="toolbar"><label>开始 <input id="dateFrom" type="date"></label><label>结束 <input id="dateTo" type="date"></label><label>店铺 <select id="storeSelect"><option value="">全部有权限店铺</option></select></label><button data-rbac-action="business-query">查询</button></div></div>
    <div class="summary"><div class="card">销售额<div id="sales" class="num">¥0</div></div><div class="card">订单量<div id="orders" class="num">0</div></div><div class="card">广告消耗<div id="adSpend" class="num">¥0</div></div><div class="card">访客<div id="visitors" class="num">0</div></div><div class="card">收藏<div id="favorites" class="num">0</div></div><div class="card">加购<div id="cartAdds" class="num">0</div></div></div>
    <div id="pageState" class="state">正在加载...</div>
    <div class="table-wrap"><table><thead><tr><th>日期</th><th>店铺</th><th>销售额</th><th>订单量</th><th>广告消耗</th><th>利润</th><th>访客</th><th>收藏</th><th>加购</th><th>转化率</th></tr></thead><tbody id="metricRows"><tr><td colspan="10">正在加载...</td></tr></tbody></table></div>
  </section>
</main></div>
<script type="text/plain" data-rbac-protected>
  const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=value=>'¥'+Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  async function api(url){const response=await fetch(url,{credentials:'include'});if(response.status===401){location.href='/login.html';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  function queryString(){const params=new URLSearchParams();if($('dateFrom').value)params.set('date_from',$('dateFrom').value);if($('dateTo').value)params.set('date_to',$('dateTo').value);if($('storeSelect').value)params.set('store_id',$('storeSelect').value);return params.toString()}
  async function loadStores(){const stores=await api('/api/stores');$('storeSelect').innerHTML='<option value="">全部有权限店铺</option>'+stores.filter(store=>store.active).map(store=>`<option value="${store.id}">${escapeHtml(store.store_name)}</option>`).join('')}
  async function loadData(){try{$('pageState').className='state';$('pageState').textContent='正在查询数据库...';const data=await api('/api/business-center/metrics?'+queryString()),summary=data.summary;$('sales').textContent=money(summary.sales_amount);$('orders').textContent=summary.orders_count;$('adSpend').textContent=money(summary.ad_spend);$('visitors').textContent=summary.visitors_count;$('favorites').textContent=summary.favorites_count;$('cartAdds').textContent=summary.cart_add_count;$('pageState').textContent=data.total?`已加载 ${data.total} 条真实经营记录。`:'当前筛选条件下暂无数据。';$('metricRows').innerHTML=data.rows.length?data.rows.map(row=>`<tr><td>${row.metric_date}</td><td>${escapeHtml(row.store_name)}</td><td class="money">${money(row.sales_amount)}</td><td>${row.orders_count}</td><td>${money(row.ad_spend)}</td><td>${money(row.profit_amount)}</td><td>${row.visitors_count}</td><td>${row.favorites_count}</td><td>${row.cart_add_count}</td><td>${Number(row.conversion_rate||0).toLocaleString('zh-CN',{style:'percent',maximumFractionDigits:2})}</td></tr>`).join(''):'<tr><td colspan="10">暂无数据</td></tr>'}catch(error){$('pageState').className='state error';$('pageState').textContent=error.message;$('metricRows').innerHTML='<tr><td colspan="10">查询失败</td></tr>'}}
  async function init(){const access=await TiantongRbac.ready;if(!access.allowed)return;$('userInfo').textContent=`${access.user.display_name} · ${access.user.role_label||access.user.role}`;const today=new Date().toISOString().slice(0,10);$('dateFrom').value=today;$('dateTo').value=today;const health=await api('/api/health');$('systemStatus').textContent=health.status==='running'?'后端健康':'后端异常';await loadStores();await loadData()}
  init().catch(error=>{$('pageState').className='state error';$('pageState').textContent=error.message});
</script>
<script type="text/plain" data-rbac-protected>TiantongRbac.bindActions({
  "business-logout":["click",function(event){return TiantongRbac.logout();}],
  "business-query":["click",function(event){return loadData();}]
});</script>
</body></html>
