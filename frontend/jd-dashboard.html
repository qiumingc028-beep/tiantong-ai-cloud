<!doctype html>
<html lang="zh-CN" data-required-menu="menu.jd_data">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>经营中心 - 天统AI</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--brand:#0f766e;--bad:#b91c1c;--good:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.auth-pending .app{visibility:hidden}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ffffff18}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.main{min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px}.top-meta,.toolbar,.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:13px}.content{padding:24px}.card,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:10px}.card{padding:16px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}h1{margin:0 0 6px}.muted{color:var(--muted)}select,input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.link{background:#ecfdf5;color:var(--brand);padding:7px 9px}.summary{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));gap:12px;margin:16px 0}.num{font-size:22px;font-weight:800;color:var(--brand);margin-top:7px}.state{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;color:var(--muted);margin-bottom:12px}.state.error{background:#fef2f2;color:var(--bad)}.table-wrap{overflow:auto;margin-bottom:16px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}th{background:#f8fafc;color:#475569}.money{font-weight:700;color:var(--brand)}.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}.details{margin-top:18px}.details.hidden{display:none}.details-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.details table{min-width:860px}@media(max-width:1200px){.summary{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.content{padding:16px}.topbar,.page-head{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI</div><nav id="menu" class="menu"></nav></aside><main class="main">
  <header class="topbar"><strong>经营中心</strong><div class="top-meta"><span id="systemStatus" class="pill">系统检查中</span><span id="releaseInfo" class="pill">版本读取中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="business-logout">退出登录</button></div></header>
  <section class="content">
    <div class="page-head"><div><h1>京东多店经营中心</h1><div class="muted">R297每5分钟自动同步真实京东数据；关闭本网页不影响客户端后台运行</div></div><div class="toolbar"><label>店铺 <select id="storeSelect"><option value="">全部有权限店铺</option></select></label><button data-rbac-action="business-query">刷新</button></div></div>
    <div class="summary"><div class="card">销售额<div id="sales" class="num">暂无数据</div></div><div class="card">订单量<div id="orders" class="num">暂无数据</div></div><div class="card">待发货<div id="pendingShipments" class="num">暂无数据</div></div><div class="card">售后单<div id="aftersales" class="num">暂无数据</div></div><div class="card">退款金额<div id="refundAmount" class="num">暂无数据</div></div><div class="card">退款订单<div id="refundOrders" class="num">暂无数据</div></div><div class="card">推广费用<div id="adSpend" class="num">暂无数据</div></div><div class="card">推广ROI<div id="roi" class="num">暂无数据</div></div></div>
    <div id="pageState" class="state">正在加载...</div>
    <div class="table-wrap"><table><thead><tr><th>店铺</th><th>自动同步</th><th>运行状态</th><th>销售额</th><th>订单</th><th>待发货</th><th>售后</th><th>最近同步</th><th>下次同步</th><th>操作</th></tr></thead><tbody id="metricRows"><tr><td colspan="10">正在加载...</td></tr></tbody></table></div>
    <section id="detailPanel" class="details card hidden"><div class="details-head"><div><strong id="detailTitle">订单明细</strong><div id="detailMeta" class="muted"></div></div><button class="secondary" data-rbac-action="business-close-details">关闭</button></div><div class="table-wrap"><table><thead id="detailHead"></thead><tbody id="detailRows"></tbody></table></div></section>
  </section>
</main></div>
<script type="text/plain" data-rbac-protected>
  const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const valueOrEmpty=value=>value===null||value===undefined?'暂无数据':String(value);const money=value=>value===null||value===undefined?'暂无数据':'¥'+Number(value).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  async function api(url,options={}){const response=await fetch(url,{credentials:'include',...options});if(response.status===401){location.href='/login.html';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  function queryString(){const params=new URLSearchParams();if($('storeSelect').value)params.set('store_id',$('storeSelect').value);return params.toString()}
  async function loadStores(){const stores=await api('/api/stores');$('storeSelect').innerHTML='<option value="">全部有权限店铺</option>'+stores.filter(store=>store.active&&store.platform==='jd').map(store=>`<option value="${store.id}">${escapeHtml(store.store_name)}</option>`).join('')}
  const statusLabel=status=>({ONLINE:'运行中',IDLE:'等待下次同步',SYNCING:'正在同步',PAUSED:'已暂停',OFFLINE:'客户端离线',ERROR:'同步异常',HUMAN_ACTION_REQUIRED:'登录/风控待处理'}[status]||status||'未知');
  const datasetRecords=(store,type)=>store.datasets&&store.datasets[type]&&store.datasets[type].records||[];
  const datasetCount=(store,type)=>store.datasets&&Object.prototype.hasOwnProperty.call(store.datasets,type)?datasetRecords(store,type).length:null;
  const datasetSum=(store,type,field)=>{const rows=datasetRecords(store,type);return rows.length?rows.reduce((sum,row)=>sum+Number(row[field]||0),0):null};
  async function toggleSync(storeId,enabled){await api(`/api/jd-workbench/sync-policies/${storeId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled,interval_seconds:300})});await loadData()}
  async function showDetails(storeId,type){const data=await api(`/api/jd-workbench/dashboard/stores/${storeId}/${type}`),isFulfillment=type==='fulfillment';$('detailPanel').classList.remove('hidden');$('detailTitle').textContent=`${data.store_name} · ${isFulfillment?'待发货订单':'售后订单'}`;$('detailMeta').textContent=data.collected_at?`采集时间 ${data.collected_at} · ${data.total} 条`:'当前暂无明细';const columns=isFulfillment?[['order_state','状态'],['product_name','商品'],['quantity','数量'],['paid_amount','实付金额'],['ordered_at','下单时间'],['promised_ship_at','最迟发货']]:[['aftersale_state','状态'],['product_name','商品'],['quantity','数量'],['refund_amount','退款金额'],['requested_at','申请时间'],['reason_category','原因分类']];$('detailHead').innerHTML='<tr>'+columns.map(([,label])=>`<th>${label}</th>`).join('')+'</tr>';$('detailRows').innerHTML=(data.records||[]).map(row=>'<tr>'+columns.map(([key])=>`<td>${escapeHtml(row[key]??'暂无')}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="${columns.length}">暂无数据</td></tr>`;$('detailPanel').scrollIntoView({behavior:'smooth',block:'start'})}
  function closeDetails(){$('detailPanel').classList.add('hidden')}
  async function loadData(){try{$('pageState').className='state';$('pageState').textContent='正在读取R297自动同步状态...';const data=await api('/api/jd-workbench/dashboard?'+queryString()),summary=data.summary||{};$('sales').textContent=money(summary.sales_amount);$('orders').textContent=valueOrEmpty(summary.orders_count);$('pendingShipments').textContent=valueOrEmpty(summary.pending_shipment_count);$('aftersales').textContent=valueOrEmpty(summary.aftersale_count);$('refundAmount').textContent=money(summary.refund_amount);$('refundOrders').textContent=valueOrEmpty(summary.refund_order_count);$('adSpend').textContent=money(summary.ad_spend);$('roi').textContent=valueOrEmpty(summary.roi);$('pageState').textContent=`${data.total} 家店铺；${data.ready_stores} 家已有真实数据；${data.human_action_required} 家需要人工处理。`;const rows=[];for(const store of data.stores||[]){const sales=datasetSum(store,'sales_daily','sales_amount'),orders=datasetSum(store,'orders','order_count')??datasetSum(store,'sales_daily','orders_count'),shipmentCount=datasetCount(store,'fulfillment_orders'),aftersaleCount=datasetCount(store,'aftersale_orders');const syncAction=TiantongRbac.registerDynamicAction("business-toggle-sync","click",function(event){toggleSync(store.store_id,!store.sync_enabled)}),shipAction=TiantongRbac.registerDynamicAction("business-view-fulfillment","click",function(event){showDetails(store.store_id,'fulfillment')}),afterAction=TiantongRbac.registerDynamicAction("business-view-aftersales","click",function(event){showDetails(store.store_id,'aftersales')});rows.push(`<tr><td><strong>${escapeHtml(store.store_name)}</strong></td><td><button class="${store.sync_enabled?'secondary':'link'}" data-rbac-action="${syncAction}">${store.sync_enabled?'暂停':'恢复'}</button><div class="muted">${store.sync_interval_seconds/60}分钟</div></td><td class="${store.sync_status==='ERROR'||store.sync_status==='HUMAN_ACTION_REQUIRED'?'bad':'good'}">${escapeHtml(statusLabel(store.sync_status))}${store.retry_count?`<div>重试 ${store.retry_count}/${5}</div>`:''}</td><td>${money(sales)}</td><td>${valueOrEmpty(orders)}</td><td>${valueOrEmpty(shipmentCount)}</td><td>${valueOrEmpty(aftersaleCount)}</td><td>${escapeHtml(store.last_sync_at||'暂无')}</td><td>${escapeHtml(store.next_sync_at||'暂无')}</td><td><div class="row-actions"><button class="link" data-rbac-action="${shipAction}">查看发货</button><button class="link" data-rbac-action="${afterAction}">查看售后</button></div></td></tr>`) }$('metricRows').innerHTML=rows.join('')||'<tr><td colspan="10">暂无数据</td></tr>'}catch(error){$('pageState').className='state error';$('pageState').textContent=error.message;$('metricRows').innerHTML='<tr><td colspan="10">查询失败</td></tr>'}}
  async function init(){const access=await TiantongRbac.ready;if(!access.allowed)return;$('userInfo').textContent=`${access.user.display_name} · ${access.user.role_label||access.user.role}`;const health=await api('/api/health');$('systemStatus').textContent=health.status==='running'&&health.database&&health.redis&&health.worker?'Backend、PostgreSQL、Redis、Worker正常':'系统存在异常';const release=health.release||{};$('releaseInfo').textContent=`${release.version||'版本未知'} · ${release.commit?release.commit.slice(0,12):'commit未知'} · ${release.build_time||'构建时间未知'}`;await loadStores();await loadData()}
  init().catch(error=>{$('pageState').className='state error';$('pageState').textContent=error.message});
</script>
<script type="text/plain" data-rbac-protected>TiantongRbac.bindActions({
  "business-logout":["click",function(event){return TiantongRbac.logout();}],
  "business-query":["click",function(event){return loadData();}],
  "business-close-details":["click",function(event){return closeDetails();}]
});</script>
</body></html>
