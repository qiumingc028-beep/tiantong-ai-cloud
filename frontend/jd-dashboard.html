<!doctype html>
<html lang="zh-CN" data-required-menu="menu.jd_data">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>经营驾驶舱 - 天统AI</title>
  <style>
    :root{--bg:#f2f5fa;--panel:#fff;--ink:#111c31;--muted:#65748b;--line:#dfe6f0;--nav:#0a1426;--nav2:#13233a;--blue:#1768e5;--green:#07845e;--orange:#d9650a;--red:#c73636;--shadow:0 12px 32px rgba(24,45,78,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.auth-pending .app{visibility:hidden}
    .app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{background:linear-gradient(180deg,var(--nav),#0d1a2f);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{height:64px;color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #ffffff18}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1c73ed,#7657e6);font-size:13px;box-shadow:0 8px 22px #1164dc44}.menu{display:flex;flex-direction:column;gap:6px;margin-top:18px}.menu a{color:#cbd5e1;text-decoration:none;padding:12px;border-radius:9px;font-size:14px}.menu a.active,.menu a:hover{background:var(--nav2);color:#fff}
    .main{min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;position:sticky;top:0;z-index:20}.top-title{display:flex;gap:9px;align-items:center}.top-title i{width:8px;height:8px;border-radius:50%;background:#12a976;box-shadow:0 0 0 5px #12a97616}.top-meta,.toolbar,.period-switch,.task-filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1760px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}h1{font-size:29px;letter-spacing:-.5px;margin:0 0 7px}.muted{color:var(--muted)}input,select{height:40px;border:1px solid #cbd5e1;border-radius:9px;padding:7px 11px;background:#fff;color:var(--ink)}input[type=search]{min-width:238px}button{border:0;background:var(--nav);color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit}button:hover{filter:brightness(1.06)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1768e533;outline-offset:2px}
    .period-switch{background:#e7edf7;padding:4px;border-radius:10px}.period-switch button{background:transparent;color:#52627a;padding:8px 13px}.period-switch button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #7485a326;font-weight:700}.refresh{background:var(--blue)}
    .state{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;color:var(--muted);margin-bottom:14px}.state.ok{border-color:#b9ead8;background:#effbf6;color:#087855}.state.error{border-color:#f1b8b8;background:#fff3f3;color:var(--red)}
    .taskbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(120deg,#101e34,#182c48);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}.taskbar-title{display:flex;align-items:center;gap:10px}.taskbar-title span{color:#aebbd0;font-size:12px}.task-filters button{background:#ffffff10;border:1px solid #ffffff1f;color:#dce6f5;padding:8px 11px;font-size:13px}.task-filters button.active{background:#fff;color:#183052}.task-count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:#ffffff19;font-size:11px}.task-filters button.active .task-count{background:#1768e51a;color:var(--blue)}
    .metric-grid{display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:12px;margin-bottom:18px}.metric-card{width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow);min-height:112px;position:relative;overflow:hidden}.metric-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}.metric-card.order:before{background:var(--green)}.metric-card.ad:before{background:var(--orange)}.metric-card.drillable{cursor:pointer}.metric-card.drillable:after{content:"查看店铺 →";position:absolute;right:13px;bottom:12px;color:var(--green);font-size:11px}.metric-label{display:block;font-size:14px;color:#52627a}.metric-value{display:block;font-size:25px;font-weight:800;margin-top:12px;color:var(--blue);white-space:nowrap}.metric-card.order .metric-value{color:var(--green)}.metric-card.ad .metric-value{color:var(--orange)}.metric-note{display:block;font-size:12px;color:#8995a8;margin-top:7px}
    .section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0 10px}.section-title h2{margin:0;font-size:20px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:1360px}th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}th{background:#f7f9fc;color:#536278;font-weight:650}tbody tr:hover{background:#f8fbff}.store-name{display:flex;flex-direction:column;gap:3px}.store-name small{color:#8895a7}.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px}.status.good{color:#087855;background:#e8f8f1}.status.warn{color:#a24a00;background:#fff2df}.status.bad{color:#b42323;background:#fff0f0}.status.muted{color:#68758a;background:#eef2f6}.source-note{margin-top:14px;font-size:13px;color:#738096}
    .drawer-backdrop{position:fixed;inset:0;background:#0b15274d;z-index:40;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:41;box-shadow:-22px 0 50px #0d1b3230;transform:translateX(102%);transition:.22s ease;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:24px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0 0 6px}.drawer-close{background:#eef2f7;color:#243149;padding:8px 11px}.drawer-body{padding:18px 24px;overflow:auto}.drawer-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.drawer-stat{background:#f6f8fc;border:1px solid var(--line);border-radius:11px;padding:13px}.drawer-stat strong{display:block;font-size:24px;margin-top:4px}.drawer table{min-width:0}.drawer th,.drawer td{white-space:normal}.drawer-empty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:1300px){.metric-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:1050px){.metric-grid{grid-template-columns:repeat(3,1fr)}.page-head,.taskbar{align-items:flex-start;flex-direction:column}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.content{padding:16px}.topbar{position:static;align-items:flex-start;flex-direction:column}.metric-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.metric-grid{grid-template-columns:1fr}input[type=search]{min-width:100%}}
  </style>
</head>
<body class="auth-pending">
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">TJ</span>天统AI云中台</div><nav id="menu" class="menu"></nav></aside>
  <main class="main">
    <header class="topbar"><strong class="top-title"><i></i>经营驾驶舱</strong><div class="top-meta"><span id="autoRefreshStatus" class="pill">30秒自动刷新</span><span id="systemStatus" class="pill">系统检查中</span><span id="releaseInfo" class="pill">版本读取中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="business-logout">退出登录</button></div></header>
    <section class="content">
      <div class="page-head">
        <div><h1>京东多店经营驾驶舱</h1><div class="muted">R297 · 自动汇总真实经营指标，异常店铺直接定位；全程只读，不读取账号、Cookie或买家隐私</div></div>
        <div class="toolbar">
          <div class="period-switch" aria-label="统计周期"><button class="active" data-period="today">今日</button><button data-period="yesterday">昨日</button><button data-period="7d">近7天</button></div>
          <input id="storeSearch" type="search" placeholder="搜索店铺名称或编号" autocomplete="off">
          <button class="refresh" data-rbac-action="business-query">刷新</button>
        </div>
      </div>
      <div id="pageState" class="state">正在加载真实同步数据...</div>
      <section class="taskbar" aria-label="经营待办">
        <div class="taskbar-title"><strong>经营待办</strong><span>点击条件快速定位店铺</span></div>
        <div class="task-filters" id="taskFilters">
          <button class="active" data-filter="all">全部<span id="countAll" class="task-count">0</span></button>
          <button data-filter="pending_shipments">待发货<span id="countShipments" class="task-count">0</span></button>
          <button data-filter="pending_refunds">售后待处理<span id="countRefunds" class="task-count">0</span></button>
          <button data-filter="abnormal_orders">异常订单<span id="countAbnormal" class="task-count">0</span></button>
          <button data-filter="human">需登录/验证<span id="countHuman" class="task-count">0</span></button>
          <button data-filter="stale">数据过期<span id="countStale" class="task-count">0</span></button>
          <button data-filter="normal">运行正常<span id="countNormal" class="task-count">0</span></button>
        </div>
      </section>
      <div id="metricGrid" class="metric-grid" data-rbac-action="metric-drilldown"></div>
      <div class="section-title"><h2>店铺经营明细</h2><span id="rangeInfo" class="muted">读取中</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>店铺</th><th>自动同步</th><th>待发货</th><th>待处理售后</th><th>异常订单</th><th>最后同步</th><th>下次同步</th><th>失败次数/原因</th><th>访客数</th><th>成交单量</th><th>推广费用</th><th>客户端版本</th></tr></thead>
        <tbody id="storeRows"><tr><td colspan="12">正在加载...</td></tr></tbody>
      </table></div>
      <div class="source-note">数据来源：京东真实页面白名单指标 → R297全自动只读客户端 → 天统AI云端。空值统一显示“暂无数据”，不会使用模拟数据填充。</div>
    </section>
  </main>
</div>
<div id="drawerBackdrop" class="drawer-backdrop" data-rbac-action="drawer-backdrop"></div>
<aside id="detailDrawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head"><div><h2 id="drawerTitle">店铺待办</h2><div id="drawerSubtitle" class="muted">按店铺查看汇总数量</div></div><button class="drawer-close" data-rbac-action="drawer-close" aria-label="关闭">关闭</button></div>
  <div class="drawer-body"><div id="drawerSummary" class="drawer-summary"></div><div class="toolbar" style="margin-bottom:14px"><select id="detailStore"><option value="">全部店铺</option></select><input id="detailStart" type="date" aria-label="开始日期"><input id="detailEnd" type="date" aria-label="结束日期"><input id="detailStatus" placeholder="筛选当前状态"><button data-rbac-action="drawer-query">查询</button></div><div id="drawerContent"></div></div>
</aside>
<script type="text/plain" data-rbac-protected>
  const $=id=>document.getElementById(id);
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const metrics=[
    ['sales_amount','成交金额','money','sales','实际成交金额'],['sales_customers','成交客户数','integer','sales','下单成交客户'],['product_units','成交商品件数','integer','sales','成交商品数量'],['visitors','店铺访客数','integer','sales','去重访问人数'],['page_views','店铺浏览量','integer','sales','页面浏览次数'],
    ['sales_orders','成交单量','integer','order','实际成交订单'],['pending_shipments','待发货订单','integer','order','点击查看订单明细'],['pending_refunds','待处理售后','integer','order','点击查看售后明细'],['abnormal_orders','异常订单','integer','order','点击查看异常明细'],
    ['ad_spend','快车花费','money','ad','广告消耗'],['ad_impressions','快车展现数','integer','ad','广告展现'],['ad_clicks','快车点击数','integer','ad','广告点击'],['ad_ctr','快车点击率','percent','ad','点击/展现'],['ad_cpc','平均点击成本','money','ad','花费/点击']
  ];
  let activePeriod='today',activeFilter='all',activeDetailType=null,dataLoading=false,allStores=[];
  function format(value,type){if(value===null||value===undefined)return '暂无数据';const number=Number(value);if(!Number.isFinite(number))return escapeHtml(value);if(type==='money')return '¥'+number.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});if(type==='percent')return number.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';return number.toLocaleString('zh-CN')}
  function formatTime(value){if(!value)return '暂无';const parsed=new Date(value);return Number.isNaN(parsed.getTime())?escapeHtml(value):parsed.toLocaleString('zh-CN',{hour12:false})}
  function isStale(store){if(!store.last_sync_at)return true;const value=new Date(store.last_sync_at).getTime();return !Number.isFinite(value)||Date.now()-value>20*60*1000}
  function statusOf(store){if(store.sync_status==='HUMAN_ACTION_REQUIRED')return [store.reason_code==='LOGIN_EXPIRED'?'登录失效':'需验证码/风控处理','bad'];if(store.sync_status==='ERROR')return ['同步异常','bad'];if(store.sync_status==='PAUSED'||store.sync_enabled===false)return ['已暂停','muted'];if(store.sync_status==='SESSION_STOPPED')return ['等待自动轮询','warn'];if(store.sync_status==='SYNCING')return ['运行中 · 同步中','good'];if(store.sync_enabled)return ['运行中','good'];return ['等待首次同步','muted']}
  function matchesFilter(store){const summary=store.summary||{};if(activeFilter==='pending_shipments')return Number(summary.pending_shipments)>0;if(activeFilter==='pending_refunds')return Number(summary.pending_refunds)>0;if(activeFilter==='abnormal_orders')return Number(summary.abnormal_orders)>0;if(activeFilter==='human')return store.sync_status==='HUMAN_ACTION_REQUIRED';if(activeFilter==='stale')return isStale(store);if(activeFilter==='normal')return store.data_state==='READY'&&!isStale(store)&&!['ERROR','HUMAN_ACTION_REQUIRED','PAUSED'].includes(store.sync_status);return true}
  function visibleStores(){const query=$('storeSearch').value.trim().toLowerCase();return allStores.filter(store=>matchesFilter(store)&&(!query||`${store.store_name||''} ${store.store_code||''}`.toLowerCase().includes(query)))}
  async function api(url){const response=await fetch(url,{credentials:'include'});if(response.status===401){location.href='/login.html';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  function queryString(){return new URLSearchParams({period:activePeriod}).toString()}
  function renderMetrics(summary){const aliases={pending_shipments:'pending_shipment_count',pending_refunds:'aftersale_count',abnormal_orders:'abnormal_order_count'};$('metricGrid').innerHTML=metrics.map(([key,label,type,kind,note])=>`<button class="metric-card ${kind} ${['pending_shipments','pending_refunds','abnormal_orders'].includes(key)?'drillable':''}" data-metric="${key}" type="button"><span class="metric-label">${label}</span><span class="metric-value">${format(summary[key]??summary[aliases[key]],type)}</span><span class="metric-note">${note}</span></button>`).join('')}
  function renderCounts(){const count=predicate=>allStores.filter(predicate).length;$('countAll').textContent=allStores.length;$('countShipments').textContent=count(store=>Number((store.summary||{}).pending_shipments)>0);$('countRefunds').textContent=count(store=>Number((store.summary||{}).pending_refunds)>0);$('countAbnormal').textContent=count(store=>Number((store.summary||{}).abnormal_orders)>0);$('countHuman').textContent=count(store=>store.sync_status==='HUMAN_ACTION_REQUIRED');$('countStale').textContent=count(isStale);$('countNormal').textContent=count(store=>store.data_state==='READY'&&!isStale(store)&&!['ERROR','HUMAN_ACTION_REQUIRED','PAUSED'].includes(store.sync_status))}
  function renderRows(){const stores=visibleStores();const rows=stores.map(store=>{const summary=store.summary||{},dataset=(store.datasets||{}).operating_metrics||{},status=statusOf(store);return `<tr><td><div class="store-name"><strong>${escapeHtml(store.store_name)}</strong><small>${escapeHtml(store.store_code||'未设置编号')} · ${escapeHtml(store.subject_name||store.subject_id||'')}</small></div></td><td><span class="status ${status[1]}">${status[0]}</span></td><td>${format(summary.pending_shipments,'integer')}</td><td>${format(summary.pending_refunds,'integer')}</td><td>${format(summary.abnormal_orders,'integer')}</td><td>${formatTime(store.last_sync_at)}</td><td>${formatTime(store.next_sync_at)}</td><td>${store.retry_count||0}${store.reason_code?` · ${escapeHtml(store.reason_code)}`:''}</td><td>${format(summary.visitors,'integer')}</td><td>${format(summary.sales_orders,'integer')}</td><td>${format(summary.ad_spend,'money')}</td><td>${escapeHtml(dataset.client_version||'暂无')}</td></tr>`});$('storeRows').innerHTML=rows.join('')||'<tr><td colspan="12">当前搜索或待办条件下没有店铺</td></tr>';$('rangeInfo').textContent=($('rangeInfo').dataset.range||'最新数据')+` · 显示 ${stores.length}/${allStores.length} 家`}
  async function loadDetails(){if(!activeDetailType)return;const params=new URLSearchParams({limit:'200'});if($('detailStore').value)params.set('store_id',$('detailStore').value);if($('detailStart').value)params.set('start_date',$('detailStart').value);if($('detailEnd').value)params.set('end_date',$('detailEnd').value);if($('detailStatus').value.trim())params.set('status',$('detailStatus').value.trim());$('drawerContent').innerHTML='<div class="drawer-empty">正在读取真实明细...</div>';try{const data=await api(`/api/jd-workbench/dashboard/details/${activeDetailType}?${params}`);const records=data.records||[];$('drawerSummary').innerHTML=`<div class="drawer-stat"><span class="muted">符合条件</span><strong>${records.length}</strong></div><div class="drawer-stat"><span class="muted">数据模式</span><strong>只读</strong></div>`;$('drawerContent').innerHTML=records.length?`<table><thead><tr><th>店铺</th><th>订单引用</th><th>商品</th><th>当前状态</th><th>日期</th></tr></thead><tbody>${records.map(row=>`<tr><td>${escapeHtml(row.store_name)}<br><small>${escapeHtml(row.store_code)}</small></td><td>${escapeHtml(row.order_reference)}</td><td>${escapeHtml(row.product_name||'暂无')}</td><td>${escapeHtml(row.current_status||'暂无')}</td><td>${escapeHtml(row.source_period||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="drawer-empty">没有符合筛选条件的真实明细</div>'}catch(error){$('drawerContent').innerHTML=`<div class="drawer-empty">${escapeHtml(error.message)}</div>`}}
  function openDrawer(metric){const mapping={pending_shipments:['fulfillment','待发货订单'],pending_refunds:['aftersales','待处理售后'],abnormal_orders:['abnormal','异常订单']};if(!mapping[metric])return;activeDetailType=mapping[metric][0];$('drawerTitle').textContent=mapping[metric][1];$('drawerSubtitle').textContent='按店铺、日期和当前状态筛选真实只读订单明细';$('detailStore').innerHTML='<option value="">全部店铺</option>'+allStores.map(store=>`<option value="${store.store_id}">${escapeHtml(store.store_name)}（${escapeHtml(store.store_code||'')}）</option>`).join('');$('detailDrawer').classList.add('open');$('drawerBackdrop').classList.add('open');$('detailDrawer').setAttribute('aria-hidden','false');loadDetails()}
  function closeDrawer(){$('detailDrawer').classList.remove('open');$('drawerBackdrop').classList.remove('open');$('detailDrawer').setAttribute('aria-hidden','true')}
  async function loadData(){if(dataLoading)return;dataLoading=true;try{$('pageState').className='state';$('pageState').textContent='正在读取R297真实经营数据...';const data=await api('/api/jd-workbench/dashboard?'+queryString());allStores=data.stores||[];renderMetrics(data.summary||{});renderCounts();const labels={today:'今日',yesterday:'昨日','7d':'近7天'};const range=`${labels[data.period]||'最新'} · ${data.period_start||'最新数据'}${data.period_end&&data.period_end!==data.period_start?' 至 '+data.period_end:''}`;$('rangeInfo').dataset.range=range;renderRows();$('pageState').className='state '+(data.ready_stores?'ok':'');$('pageState').textContent=`自动同步：运行中 ${data.running_stores||0} 家 / 已暂停 ${data.paused_stores||0} 家；最近周期成功 ${data.successful_stores||0} 家、失败 ${data.failed_stores||0} 家${data.failure_reasons&&data.failure_reasons.length?'；'+data.failure_reasons.map(item=>item.store_name+': '+item.reason_code).join('，'):''}。`;$('autoRefreshStatus').textContent=`30秒自动刷新 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`}catch(error){$('pageState').className='state error';$('pageState').textContent=error.message;$('storeRows').innerHTML='<tr><td colspan="12">查询失败</td></tr>'}finally{dataLoading=false}}
  async function init(){const access=await TiantongRbac.ready;if(!access.allowed)return;$('userInfo').textContent=`${access.user.display_name} · ${access.user.role_label||access.user.role}`;const health=await api('/api/health');$('systemStatus').textContent=health.status==='running'&&health.database&&health.redis&&health.worker?'服务正常':'系统存在异常';const release=health.release||{};$('releaseInfo').textContent=`${release.version||'版本未知'} · ${release.commit?release.commit.slice(0,12):'commit未知'} · ${release.build_time||'构建时间未知'}`;await loadData();setInterval(loadData,30000)}
  document.querySelectorAll('[data-period]').forEach(button=>button.addEventListener('click',async()=>{activePeriod=button.dataset.period;document.querySelectorAll('[data-period]').forEach(item=>item.classList.toggle('active',item===button));await loadData()}));
  $('storeSearch').addEventListener('input',renderRows);
  $('taskFilters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;activeFilter=button.dataset.filter;$('taskFilters').querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));renderRows()});
  init().catch(error=>{$('pageState').className='state error';$('pageState').textContent=error.message});
</script>
<script type="text/plain" data-rbac-protected>TiantongRbac.bindActions({
  "business-logout":["click",function(event){return TiantongRbac.logout();}],
  "business-query":["click",function(event){return loadData();}],
  "metric-drilldown":["click",function(event){const card=event.target.closest('[data-metric]');if(card)return openDrawer(card.dataset.metric);}],
  "drawer-close":["click",function(event){return closeDrawer();}],
  "drawer-backdrop":["click",function(event){return closeDrawer();}],
  "drawer-query":["click",function(event){return loadDetails();}]
});</script>
