<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推广费用 - 天统AI经营云中台</title><style>body{font:14px Arial;margin:0;background:#f3f6fa;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.nav a{margin-right:16px;color:#145ea8}.card{background:#fff;border:1px solid #dde6f0;border-radius:8px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{font-size:24px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style><div class="wrap"><nav class="nav"><a href="/business.html">老板驾驶舱</a><a href="/sales.html">销售中心</a><a href="/promotion-expenses.html">推广费用</a><a href="/import.html">数据导入</a></nav><h1>推广费用中心</h1><p>京东快车、海投、京挑客费用汇总、趋势与 ROI。</p><div class="card"><div class="grid"><div>推广总费用<div id="spend" class="metric">暂无数据</div></div><div>推广ROI<div id="roi" class="metric">暂无数据</div></div><div>推广费率<div id="rate" class="metric">暂无数据</div></div><div>成交金额<div class="metric">暂无数据</div></div><div>异常计划<div class="metric">暂无数据</div></div></div></div><div class="card"><h3>导入推广明细</h3><a href="/import.html">上传 CSV/XLSX 模板</a><p>没有推广数据时显示“暂无数据”，不使用 Mock 经营结果。</p></div></div><script>fetch('/api/jd/metrics/summary',{credentials:'include'}).then(r=>r.json()).then(d=>{const s=Number(d.ad_spend||0),v=Number(d.today_sales||0);spend.textContent=s.toLocaleString('zh-CN');roi.textContent=s?((v/s).toFixed(2)):'暂无数据';rate.textContent=v?((s/v*100).toFixed(2)+'%'):'暂无数据'}).catch(()=>{});</script>
