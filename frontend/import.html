<!doctype html>
<html lang="zh-CN" data-required-menu="menu.import">
<head>
  <style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>店铺与数据 - 天统AI</title>
  <style>
    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.auth-pending .app{visibility:hidden}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ffffff18}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.main{min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px}.top-meta,.toolbar,.counts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:13px}.content{padding:24px}.card,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.table-wrap{padding:0;overflow:auto}h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}select,input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff}select{min-width:240px}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.state{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;color:var(--muted);white-space:pre-wrap}.state.ok{background:#f0fdf4;color:var(--good)}.state.error{background:#fef2f2;color:var(--bad)}.count{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:120px}.count strong{display:block;font-size:24px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc;color:#475569}@media(max-width:760px){.app{grid-template-columns:1fr}.content{padding:16px}.topbar{align-items:flex-start;gap:10px;flex-direction:column}}
  </style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI</div><nav id="menu" class="menu"></nav></aside><main class="main">
  <header class="topbar"><strong>店铺与数据</strong><div class="top-meta"><span id="systemStatus" class="pill">系统检查中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="import-logout">退出登录</button></div></header>
  <section class="content">
    <div class="card"><h1>京东经营数据导入</h1><p class="muted">选择内部测试店铺并上传 XLSX 或 CSV。数据写入后可在经营中心与老板驾驶舱查询。</p></div>
    <div class="card">
      <div class="toolbar"><label>店铺 <select id="storeSelect"><option value="">正在加载...</option></select></label><label>文件 <input id="fileInput" type="file" accept=".xlsx,.csv"></label><button id="uploadButton" data-rbac-action="import-upload">开始导入</button><button data-rbac-action="import-refresh">刷新记录</button></div>
      <div id="importState" class="state">请选择店铺和文件。</div>
      <div class="counts" style="margin-top:12px"><div class="count">总行数<strong id="totalRows">0</strong></div><div class="count">成功<strong id="successRows">0</strong></div><div class="count">失败<strong id="failedRows">0</strong></div></div>
    </div>
    <div class="card"><h2>错误明细</h2><div class="table-wrap"><table><thead><tr><th>行号</th><th>失败原因</th></tr></thead><tbody id="errorRows"><tr><td colspan="2">暂无错误</td></tr></tbody></table></div></div>
    <div class="card"><h2>导入记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>状态</th><th>总行数</th><th>成功</th><th>失败</th></tr></thead><tbody id="historyRows"><tr><td colspan="5">正在加载...</td></tr></tbody></table></div></div>
  </section>
</main></div>
<script type="text/plain" data-rbac-protected>
  const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(url,options={}){const response=await fetch(url,{credentials:'include',...options});if(response.status===401){location.href='/login.html';throw new Error('登录已失效')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  async function loadStores(){const stores=await api('/api/stores');const active=stores.filter(store=>store.active);$('storeSelect').innerHTML='<option value="">请选择内部测试店铺</option>'+active.map(store=>`<option value="${store.id}">${escapeHtml(store.store_name)}（${escapeHtml(store.store_code)}）</option>`).join('')}
  async function loadHistory(){const data=await api('/api/metrics/import-records');$('historyRows').innerHTML=data.records.length?data.records.map(row=>`<tr><td>${escapeHtml((row.created_at||'').slice(0,19).replace('T',' '))}</td><td>${escapeHtml(row.status)}</td><td>${row.total_rows}</td><td>${row.success_rows}</td><td>${row.failed_rows}</td></tr>`).join(''):'<tr><td colspan="5">暂无导入记录</td></tr>'}
  function renderResult(data){$('totalRows').textContent=data.total_rows;$('successRows').textContent=data.success_rows;$('failedRows').textContent=data.failed_rows;$('errorRows').innerHTML=data.errors.length?data.errors.map(error=>`<tr><td>${error.row}</td><td>${escapeHtml(error.reason)}</td></tr>`).join(''):'<tr><td colspan="2">暂无错误</td></tr>';$('importState').className=`state ${data.status==='failed'?'error':'ok'}`;$('importState').textContent=data.duplicate?'重复文件已拦截，未再次写入。':`导入${data.status==='success'?'成功':data.status==='partial_success'?'部分成功':'失败'}。`}
  async function upload(){const storeId=$('storeSelect').value,file=$('fileInput').files[0];if(!storeId||!file){$('importState').className='state error';$('importState').textContent='请先选择店铺和 XLSX/CSV 文件。';return}$('uploadButton').disabled=true;$('importState').className='state';$('importState').textContent='导入中，请勿重复提交...';try{const form=new FormData();form.append('store_id',storeId);form.append('file',file);renderResult(await api('/api/metrics/import',{method:'POST',body:form}));await loadHistory()}catch(error){$('importState').className='state error';$('importState').textContent=error.message}finally{$('uploadButton').disabled=false}}
  async function init(){const access=await TiantongRbac.ready;if(!access.allowed)return;$('userInfo').textContent=`${access.user.display_name} · ${access.user.role_label||access.user.role}`;const health=await api('/api/health');$('systemStatus').textContent=health.status==='running'?'后端健康':'后端异常';await Promise.all([loadStores(),loadHistory()])}
  init().catch(error=>{$('importState').className='state error';$('importState').textContent=error.message});
</script>
<script type="text/plain" data-rbac-protected>TiantongRbac.bindActions({
  "import-logout":["click",function(event){return TiantongRbac.logout();}],
  "import-upload":["click",function(event){return upload();}],
  "import-refresh":["click",function(event){return loadHistory();}]
});</script>
</body></html>
