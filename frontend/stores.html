<!doctype html>
<html lang="zh-CN" data-required-menu="menu.stores">
<head><style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店铺管理 - 天统AI云中台</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--brand:#0f766e;--dark:#111827;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;color:#cbd5e1;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08)}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.menu a.disabled{opacity:.5}.main{min-width:0}.topbar{min-height:64px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:16px}.top-title{font-weight:700}.top-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px}.ok{color:var(--good)}.content{padding:24px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}h1{font-size:26px;margin:0}.sub,.tip{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.form-row,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}th{background:#f8fafc;color:#475569}.green{color:var(--good);font-weight:700}.red{color:var(--bad);font-weight:700}.state{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;color:var(--muted);margin-bottom:12px}.state.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}@media(max-width:760px){.app{grid-template-columns:1fr}.topbar,.page-head{align-items:flex-start;flex-direction:column}.content{padding:18px}}
  .auth-pending .sidebar,.auth-pending .main,.auth-pending main{visibility:hidden}</style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI云中台</div><nav id="menu" class="menu"></nav></aside><main class="main">
    <header class="topbar"><div class="top-title">店铺管理</div><div class="top-meta"><span id="currentTime" class="pill"></span><span id="systemStatus" class="pill">系统检查中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="stores-001">退出登录</button></div></header>
    <section class="content">
      <div class="page-head"><div><h1>店铺管理</h1><div class="sub">60家京东店铺档案、负责人分配和状态维护</div></div><button class="secondary" data-rbac-action="stores-002">刷新</button></div>
      <div class="card">
        <h2>新增店铺</h2><p class="tip">只维护真实店铺档案；经营中心和店铺管理共用这一份店铺数据。</p>
        <div class="form-row"><select id="platform"><option value="jd">京东</option><option value="tmall">天猫</option><option value="taobao">淘宝</option><option value="pdd">拼多多</option><option value="douyin">抖音</option><option value="tiktok">TikTok</option></select><input id="store_code" placeholder="真实店铺编号"><input id="store_name" placeholder="真实店铺名称"><input id="notes" placeholder="备注"><button data-rbac-action="stores-003">新增店铺</button></div>
      </div>
      <div class="card">
        <div class="toolbar"><input id="search" placeholder="搜索编号/名称/负责人" data-rbac-action="stores-005"><select id="platformFilter" data-rbac-action="stores-006"><option value="">全部平台</option><option value="jd">京东</option><option value="tmall">天猫</option><option value="taobao">淘宝</option><option value="pdd">拼多多</option><option value="douyin">抖音</option><option value="tiktok">TikTok</option></select><select id="statusFilter" data-rbac-action="stores-007"><option value="">全部状态</option><option value="active">启用</option><option value="inactive">停用</option></select><button class="secondary" data-rbac-action="stores-008">刷新表格</button></div>
      </div>
      <div id="pageState" class="state">正在加载店铺...</div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>平台</th><th>编号</th><th>店铺名称</th><th>负责人</th><th>店铺状态</th><th>同步状态</th><th>最近同步</th><th>下次同步</th><th>备注</th><th>操作</th></tr></thead><tbody id="stores"></tbody></table></div>
    </section></main></div>
  <script type="text/plain" data-rbac-protected>
    const menus=[['老板驾驶舱','/index.html'],['老板控制中心','/control.html'],['店铺管理','/stores.html'],['京东60店数据中心','/jd-dashboard.html'],['京东数据接入','/jd-integrations.html'],['广告中心','/ads.html'],['今日数据录入','/metrics.html'],['Excel导入','/import.html'],['AI素材中心','/ai-assets.html'],['AI工作流中心','/workflows.html'],['AI员工中心','/ai-employees.html'],['账号资料中心','/account-center.html'],['模板中心','/template-center.html'],['品牌中心','/brands.html'],['店铺分组','/store-groups.html'],['天藏：知识资产中心','/knowledge-center.html'],['系统设置','/settings.html']];let users=[],storeRows=[],syncByStore=new Map();
    function renderMenu(active){menu.innerHTML=menus.map(([l,h])=>`<a class="${h===active?'active ':''}${h.startsWith('#')?'disabled':''}" href="${h}" ${h.startsWith('#')?'data-rbac-action="stores-disabled-entry"':''}>${l}</a>`).join('')}function disabledEntry(){alert('账号资料中心入口已预留，等待后端页面路由开放。');return false}function tick(){currentTime.innerText=new Date().toLocaleString('zh-CN',{hour12:false})}async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html'}async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});if(r.status===401){location.href='/login.html';return}if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'请求失败')}return r.json()}async function init(){renderMenu('/stores.html');tick();setInterval(tick,1000);const me=await api('/api/me');userInfo.innerText=`${me.display_name} · ${me.role_label||me.role}`;const h=await fetch('/api/health').then(r=>r.json()).catch(()=>null);systemStatus.innerText=h?`服务器正常 · 数据库 ${h.database} · Redis ${h.redis}`:'系统状态获取失败';if(h)systemStatus.classList.add('ok')}
    function platformName(p){return {jd:'京东',tmall:'天猫',taobao:'淘宝',pdd:'拼多多',douyin:'抖音',tiktok:'TikTok'}[p]||p}function userOptions(id){return '<option value="">未分配</option>'+users.map(u=>`<option value="${u.id}" ${id===u.id?'selected':''}>${u.display_name}（${u.username}）</option>`).join('')}
    const syncLabel=status=>({ONLINE:'运行中',IDLE:'等待同步',SYNCING:'同步中',PAUSED:'已暂停',OFFLINE:'客户端离线',ERROR:'同步异常',HUMAN_ACTION_REQUIRED:'登录/风控待处理'}[status]||status||'暂无客户端');
    async function loadAll(){try{pageState.className='state';pageState.innerText='正在加载店铺与自动同步状态...';const [userRows,storesRows,syncData]=await Promise.all([api('/api/store-users'),api('/api/stores'),api('/api/jd-workbench/dashboard')]);users=userRows;storeRows=storesRows;syncByStore=new Map((syncData.stores||[]).map(row=>[row.store_id,row]));renderStores()}catch(e){pageState.className='state error';pageState.innerText=e.message||'店铺加载失败';stores.innerHTML='<tr><td colspan="11">加载失败，请稍后刷新</td></tr>'}}
    function renderStores(){const q=search.value.trim().toLowerCase(),pf=platformFilter.value,sf=statusFilter.value;const rows=storeRows.filter(s=>(!pf||s.platform===pf)&&(!sf||(sf==='active'?s.active:!s.active))&&(!q||[s.store_code,s.store_name,s.notes,s.manager&&s.manager.display_name].join(' ').toLowerCase().includes(q)));pageState.innerText=rows.length?`已显示 ${rows.length} / ${storeRows.length} 家店铺；同步状态与经营中心使用同一真实数据源。`:'没有符合条件的店铺。';stores.innerHTML=rows.length?rows.map(s=>{const sync=syncByStore.get(s.id)||{};return `<tr><td>${s.id}</td><td>${platformName(s.platform)}</td><td>${s.store_code}</td><td>${s.store_name}</td><td><select data-rbac-action="${TiantongRbac.registerDynamicAction("stores-009","change",function(event){assignStore((s.id),this.value);})}>${userOptions(s.manager?s.manager.id:null)}</select></td><td>${s.active?'<span class="green">启用</span>':'<span class="red">停用</span>'}</td><td class="${sync.sync_status==='ERROR'||sync.sync_status==='HUMAN_ACTION_REQUIRED'?'red':'green'}">${syncLabel(sync.sync_status)}</td><td>${sync.last_sync_at||'暂无'}</td><td>${sync.next_sync_at||'暂无'}</td><td>${s.notes||''}</td><td><button data-rbac-action="${TiantongRbac.registerDynamicAction("stores-010","click",function(event){toggleStore((s.id));})}>${s.active?'停用':'启用'}</button></td></tr>`}).join(''):'<tr><td colspan="11">暂无数据</td></tr>'}
    async function createStore(){try{await api('/api/stores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:platform.value,store_code:store_code.value.trim(),store_name:store_name.value.trim(),notes:notes.value.trim()})});await loadAll();alert('店铺已新增')}catch(e){alert(e.message)}}async function assignStore(id,managerUserId){try{await api(`/api/stores/${id}/assign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({manager_user_id:managerUserId?Number(managerUserId):null})});await loadAll()}catch(e){alert(e.message)}}async function toggleStore(id){try{await api(`/api/stores/${id}/toggle`,{method:'POST'});await loadAll()}catch(e){alert(e.message)}}
    init().then(loadAll).catch(e=>{pageState.className='state error';pageState.innerText=e.message||'页面加载失败'});
  </script>

<script type="text/plain" data-rbac-protected>
TiantongRbac.bindActions({
  "stores-disabled-entry":["click",function(event){return disabledEntry();}],
  "stores-001":["click",function(event){return TiantongRbac.logout();}],
  "stores-002":["click",function(event){loadAll();}],
  "stores-003":["click",function(event){createStore();}],
  "stores-005":["input",function(event){renderStores();}],
  "stores-006":["change",function(event){renderStores();}],
  "stores-007":["change",function(event){renderStores();}],
  "stores-008":["click",function(event){loadAll();}]
});
</script>
</body>
</html>
