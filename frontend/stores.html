<!doctype html>
<html lang="zh-CN" data-required-menu="menu.stores">
<head><style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店铺管理 - 天统AI云中台</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--brand:#0f766e;--dark:#111827;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;color:#cbd5e1;padding:18px 14px}.brand{height:56px;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08)}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}.menu a.active,.menu a:hover{background:#1f2937;color:#fff}.menu a.disabled{opacity:.5}.main{min-width:0}.topbar{min-height:64px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:16px}.top-title{font-weight:700}.top-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px}.ok{color:var(--good)}.content{padding:24px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}h1{font-size:26px;margin:0}.sub,.tip{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.form-row,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff}button{border:0;background:var(--dark);color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--bad)}.login-actions{display:flex;gap:6px;flex-wrap:wrap}.login-actions button{padding:7px 9px;font-size:12px}.login-state{display:block;margin-top:5px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}th{background:#f8fafc;color:#475569}.green{color:var(--good);font-weight:700}.red{color:var(--bad);font-weight:700}.state{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;color:var(--muted);margin-bottom:12px}.state.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}@media(max-width:760px){.app{grid-template-columns:1fr}.topbar,.page-head{align-items:flex-start;flex-direction:column}.content{padding:18px}}
  .auth-pending .sidebar,.auth-pending .main,.auth-pending main{visibility:hidden}</style>
</head>
<body class="auth-pending">
<div class="app"><aside class="sidebar"><div class="brand">天统AI云中台</div><nav id="menu" class="menu"></nav></aside><main class="main">
    <header class="topbar"><div class="top-title">店铺管理</div><div class="top-meta"><span id="currentTime" class="pill"></span><span id="systemStatus" class="pill">系统检查中</span><span id="userInfo" class="pill">加载中</span><button data-rbac-action="stores-001">退出登录</button></div></header>
    <section class="content">
      <div class="page-head"><div><h1>店铺管理</h1><div class="sub">统一读取经营中心同一套真实店铺与同步状态</div></div><button class="secondary" data-rbac-action="stores-002">刷新</button></div>
      <div class="card">
        <h2>新增真实店铺</h2><p class="tip">店铺写入统一 stores 表；本页不生成占位档案或模拟数据。</p>
        <div class="form-row"><select id="platform"><option value="jd">京东</option><option value="tmall">天猫</option><option value="taobao">淘宝</option><option value="pdd">拼多多</option><option value="douyin">抖音</option><option value="tiktok">TikTok</option></select><input id="store_code" placeholder="店铺编号"><input id="store_name" placeholder="店铺名称"><input id="notes" placeholder="备注"><button data-rbac-action="stores-003">新增店铺</button></div>
      </div>
      <div class="card">
        <div class="toolbar"><input id="search" placeholder="搜索店铺名称、编号、主体或登录状态" data-rbac-action="stores-005"><select id="platformFilter" data-rbac-action="stores-006"><option value="">全部平台</option><option value="jd">京东</option><option value="tmall">天猫</option><option value="taobao">淘宝</option><option value="pdd">拼多多</option><option value="douyin">抖音</option><option value="tiktok">TikTok</option></select><select id="statusFilter" data-rbac-action="stores-007"><option value="">全部启停状态</option><option value="active">启用</option><option value="inactive">停用</option></select><select id="loginFilter" data-rbac-action="stores-011"><option value="">全部登录状态</option><option value="online">已登录</option><option value="syncing">自动同步中</option><option value="error">同步异常</option><option value="expired">登录失效</option><option value="captcha">需要验证码</option><option value="risk">风控待处理</option><option value="offline">未连接</option><option value="paused">已暂停</option></select><button class="secondary" data-rbac-action="stores-008">刷新表格</button></div>
      </div>
      <div id="pageState" class="state">正在加载店铺...</div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>平台</th><th>编号</th><th>店铺名称</th><th>主体</th><th>登录/同步状态</th><th>负责人</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody id="stores"></tbody></table></div>
    </section></main></div>
  <script type="text/plain" data-rbac-protected src="/r297-store-view.js"></script>
  <script type="text/plain" data-rbac-protected src="/r297-owner-login.js"></script>
  <script type="text/plain" data-rbac-protected>
    const menus=[['老板驾驶舱','/index.html'],['老板控制中心','/control.html'],['店铺管理','/stores.html'],['京东60店数据中心','/jd-dashboard.html'],['京东数据接入','/jd-integrations.html'],['广告中心','/ads.html'],['今日数据录入','/metrics.html'],['Excel导入','/import.html'],['AI素材中心','/ai-assets.html'],['AI工作流中心','/workflows.html'],['AI员工中心','/ai-employees.html'],['账号资料中心','/account-center.html'],['模板中心','/template-center.html'],['品牌中心','/brands.html'],['店铺分组','/store-groups.html'],['天藏：知识资产中心','/knowledge-center.html'],['系统设置','/settings.html']];let users=[],storeRows=[],currentUser=null,closingStoreIds=[];const loginStates=new Map(),loginPollers=new Map(),loginOperationGates=new Map(),loginAbortControllers=new Map(),loginWindows=R297OwnerLogin.createWindowRegistry(),pageCloseReporter=R297OwnerLogin.createPageCloseReporter(),loginBusy=new Set(),storeLoadGate=R297StoreView.createLatestRequestGate();let ownerLoginClient=null;
    function renderMenu(active){menu.innerHTML=menus.map(([l,h])=>`<a class="${h===active?'active ':''}${h.startsWith('#')?'disabled':''}" href="${h}" ${h.startsWith('#')?'data-rbac-action="stores-disabled-entry"':''}>${l}</a>`).join('')}function disabledEntry(){alert('账号资料中心入口已预留，等待后端页面路由开放。');return false}function tick(){currentTime.innerText=new Date().toLocaleString('zh-CN',{hour12:false})}async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html'}async function api(url,opt={}){let r;try{r=await fetch(url,{credentials:'include',...opt})}catch(error){throw new Error('网络连接失败，请稍后重试')}if(r.status===401){location.href='/login.html';throw new Error('登录已失效')}if(!r.ok){const d=await r.json().catch(()=>({})),error=new Error(d.detail||'请求失败，请稍后重试');error.status=r.status;throw error}return r.json()}async function init(){renderMenu('/stores.html');tick();setInterval(tick,1000);currentUser=await api('/api/me');ownerLoginClient=R297OwnerLogin.createClient((url,opt)=>fetch(url,{credentials:'include',...opt}));userInfo.innerText=`${currentUser.display_name} · ${currentUser.role_label||currentUser.role}`;const h=await fetch('/api/health').then(r=>r.json()).catch(()=>null);systemStatus.innerText=h?`服务器正常 · 数据库 ${h.database} · Redis ${h.redis}`:'系统状态获取失败';if(h)systemStatus.classList.add('ok')}
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function platformName(p){return R297StoreView.PLATFORM_LABELS[p]||p||'暂无真实数据'}function userOptions(id){return '<option value="">未分配</option>'+users.map(u=>`<option value="${escapeHtml(u.id)}" ${id===u.id?'selected':''}>${escapeHtml(u.display_name)}（${escapeHtml(u.username)}）</option>`).join('')}
    async function loadAll(){const token=storeLoadGate.begin();try{pageState.className='state';pageState.innerText='正在加载店铺...';const [nextUsers,nextStores]=await Promise.all([api('/api/store-users'),R297StoreView.loadStoreDirectory(api)]);if(!storeLoadGate.isCurrent(token))return;users=nextUsers;storeRows=nextStores;renderStores()}catch(e){if(!storeLoadGate.isCurrent(token))return;pageState.className='state error';pageState.innerText=e.message||'店铺加载失败';stores.innerHTML='<tr><td colspan="10">加载失败，请稍后刷新</td></tr>'}}
    function loginView(store){const state=loginStates.get(Number(store.id));return R297OwnerLogin.statusView(state&&state.status)}
    function ownerLoginControls(store,status){if(!R297OwnerLogin.isOwner(currentUser)||store.platform!=='jd')return '';if(!store.active)return '<span class="login-state">店铺已暂停，无法登录</span>';const busy=loginBusy.has(Number(store.id))?' disabled':'',ticketDisabled=status.code==='ACTIVE'&&!busy?'':' disabled',loginLabel=status.code==='UNKNOWN'||status.code==='OFFLINE'||status.code==='LOGIN_REQUIRED'||status.code==='REVOKED'?'京东登录':'重新验证';return `<div class="login-actions"><button${busy} data-rbac-action="${TiantongRbac.registerDynamicAction("stores-owner-login","click",function(event){startOwnerLogin(store.id);})}">${loginLabel}</button><button class="secondary"${ticketDisabled} data-rbac-action="${TiantongRbac.registerDynamicAction("stores-owner-ticket","click",function(event){requestLoginWindow(store.id);})}">打开受控验证窗口</button><button class="danger"${busy} data-rbac-action="${TiantongRbac.registerDynamicAction("stores-owner-close","click",function(event){closeOwnerLogin(store.id);})}">关闭会话</button></div>`}
    function renderStores(){const rows=R297StoreView.filterStores(storeRows,{query:search.value,platform:platformFilter.value,enabled:statusFilter.value,login:loginFilter.value});pageState.innerText=rows.length?`已显示 ${rows.length} / ${storeRows.length} 家真实店铺。`:'暂无真实数据';stores.innerHTML=rows.length?rows.map(s=>{const status=R297StoreView.storeStatus(s),statusClass=status.tone==='good'?'green':status.tone==='muted'?'':'red',login=loginView(s),session=loginStates.get(Number(s.id)),remaining=session&&Number.isFinite(session.expires_in)?` · 剩余 ${session.expires_in} 秒`:'';return `<tr><td>${escapeHtml(s.id)}</td><td>${escapeHtml(platformName(s.platform))}</td><td>${escapeHtml(s.store_code)}</td><td>${escapeHtml(s.store_name)}</td><td>${escapeHtml(s.subject_name||s.subject_code||s.subject_id||'暂无真实数据')}</td><td><span class="${statusClass}">${status.label}</span><small class="login-state">云端登录：${escapeHtml(login.label+remaining)}</small></td><td><select data-rbac-action="${TiantongRbac.registerDynamicAction("stores-009","change",function(event){assignStore((s.id),this.value);})}">${userOptions(s.manager?s.manager.id:null)}</select></td><td>${s.active?'<span class="green">启用</span>':'<span class="red">停用</span>'}</td><td>${escapeHtml(s.notes||'暂无真实数据')}</td><td>${ownerLoginControls(s,login)}<button data-rbac-action="${TiantongRbac.registerDynamicAction("stores-010","click",function(event){toggleStore((s.id));})}">${s.active?'停用':'启用'}</button></td></tr>`}).join(''):'<tr><td colspan="10">暂无真实数据</td></tr>'}
    async function createStore(){try{await R297StoreView.createStore(api,{platform:platform.value,store_code:store_code.value.trim(),store_name:store_name.value.trim(),notes:notes.value.trim()});await loadAll();alert('店铺已新增')}catch(e){alert(e.message)}}async function assignStore(id,managerUserId){try{await R297StoreView.assignStore(api,id,managerUserId);await loadAll()}catch(e){alert(e.message)}}async function toggleStore(id){try{await R297StoreView.toggleStore(api,id);await loadAll()}catch(e){alert(e.message)}}
    function operationGateFor(storeId){const id=Number(storeId);if(!loginOperationGates.has(id))loginOperationGates.set(id,R297OwnerLogin.createOperationGate());return loginOperationGates.get(id)}
    function saveLoginState(storeId,response){const state=R297OwnerLogin.sessionState(storeId,response);loginStates.set(state.store_id,state);renderStores();return state}
    function showLoginError(storeId,error){if(error&&error.status===401){location.href='/login.html';return}const status=error&&error.status===503?'RUNTIME_UNAVAILABLE':error&&error.status===410?'TICKET_EXPIRED':error&&error.status===403?'AUTHORIZATION_REVOKED':'ERROR';loginStates.set(Number(storeId),{store_id:Number(storeId),status});renderStores();alert(error&&error.status===503?'云端登录服务暂不可用':R297OwnerLogin.errorMessage(error))}
    function pollerFor(storeId){const id=Number(storeId);if(!loginPollers.has(id))loginPollers.set(id,R297OwnerLogin.createPoller({fetchStatus:async()=>R297OwnerLogin.sessionState(id,await ownerLoginClient.status(id)),onStatus:state=>saveLoginState(id,state),onError:error=>showLoginError(id,error),isAllowed:()=>R297OwnerLogin.isOwner(currentUser)&&document.getElementById('stores')!==null}));return loginPollers.get(id)}
    async function startOwnerLogin(storeId){if(!R297OwnerLogin.isOwner(currentUser))return showLoginError(storeId,{status:403});const id=Number(storeId),gate=operationGateFor(id);if(loginBusy.has(id))return;const token=gate.begin();loginBusy.add(id);renderStores();try{const response=await ownerLoginClient.create(id);if(!gate.isCurrent(token))return;saveLoginState(id,response);await pollerFor(id).start(id)}catch(error){if(gate.isCurrent(token))showLoginError(id,error)}finally{if(gate.isCurrent(token)){loginBusy.delete(id);renderStores()}}}
    function closeViewerWindow(storeId){loginWindows.close(storeId)}
    async function requestLoginWindow(storeId){if(!R297OwnerLogin.isOwner(currentUser))return showLoginError(storeId,{status:403});const id=Number(storeId),gate=operationGateFor(id);if(loginWindows.focus(id))return;if(loginBusy.has(id)||loginView({id}).code!=='ACTIVE')return;const viewerWindow=window.open('about:blank','_blank','popup');if(!viewerWindow)return alert('浏览器已拦截受控登录窗口，请允许本页面打开窗口后重试');viewerWindow.opener=null;loginWindows.track(id,viewerWindow);const token=gate.begin(),controller=new AbortController();loginAbortControllers.set(id,controller);loginBusy.add(id);renderStores();try{const viewerPath=await R297OwnerLogin.openViewer({client:ownerLoginClient,request:fetch,storeId:id,signal:controller.signal,isActive:()=>gate.isCurrent(token)});if(!viewerPath){loginWindows.close(id);return}viewerWindow.location.replace(viewerPath);await pollerFor(id).start(id)}catch(error){loginWindows.close(id);if(gate.isCurrent(token))showLoginError(id,error)}finally{if(loginAbortControllers.get(id)===controller)loginAbortControllers.delete(id);if(gate.isCurrent(token)){loginBusy.delete(id);renderStores()}}}
    async function closeOwnerLogin(storeId){if(!R297OwnerLogin.isOwner(currentUser))return showLoginError(storeId,{status:403});const id=Number(storeId),gate=operationGateFor(id);if(loginBusy.has(id))return;const token=gate.begin();loginBusy.add(id);renderStores();try{const response=await ownerLoginClient.close(id);if(!gate.isCurrent(token))return;const state=saveLoginState(id,response);pollerFor(id).stop();closeViewerWindow(id);alert(state.status==='REVOKED'?'云端登录授权已撤销':'云端登录会话已关闭')}catch(error){if(gate.isCurrent(token))showLoginError(id,error)}finally{if(gate.isCurrent(token)){loginBusy.delete(id);renderStores()}}}
    function stopLoginPolling(event){const openStoreIds=loginWindows.ids();try{if(event&&event.type==='beforeunload')closingStoreIds=openStoreIds;if(event&&event.type==='pagehide'){pageCloseReporter.report(event,openStoreIds.length?openStoreIds:closingStoreIds);closingStoreIds=[]}}finally{R297OwnerLogin.closePageResources({operationGates:loginOperationGates,abortControllers:loginAbortControllers,busy:loginBusy,pollers:loginPollers,windows:loginWindows})}}addEventListener('beforeunload',stopLoginPolling);addEventListener('pagehide',stopLoginPolling);
    init().then(async()=>{await loadAll();setInterval(()=>{if(!document.hidden)loadAll()},30000)}).catch(e=>{pageState.className='state error';pageState.innerText=e.message||'页面加载失败'});
  </script>

<script type="text/plain" data-rbac-protected>
TiantongRbac.bindActions({
  "stores-disabled-entry":["click",function(event){return disabledEntry();}],
  "stores-001":["click",function(event){return TiantongRbac.logout();}],
  "stores-002":["click",function(event){loadAll();}],
  "stores-003":["click",function(event){createStore();}],
  "stores-005":["input",function(event){renderStores();}],
  "stores-006":["change",function(event){renderStores();}],
  "stores-007":["change",function(event){renderStores();}],
  "stores-008":["click",function(event){loadAll();}],
  "stores-011":["change",function(event){renderStores();}]
});
</script>
</body>
</html>
