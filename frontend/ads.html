<!doctype html><html lang="zh-CN" data-required-menu="menu.ads"><head><style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>广告中心 - 天统AI云中台</title><style>

body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f6f8;color:#111827}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;color:#cbd5e1;padding:18px 14px}.brand{height:56px;color:white;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08)}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}.menu a.active,.menu a:hover{background:#1f2937;color:white}.menu a.disabled{opacity:.5}.topbar{min-height:64px;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:16px}.top-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#64748b;font-size:13px}.pill{border:1px solid #e5e7eb;background:#f8fafc;border-radius:999px;padding:5px 9px}.content{padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:8px;padding:18px;margin-bottom:16px}.sub{color:#64748b;line-height:1.8}@media(max-width:760px){.app{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.content{padding:18px}}.auth-pending .sidebar,.auth-pending .main,.auth-pending main{visibility:hidden}</style></head><body class="auth-pending">

<div class="app"><aside class="sidebar"><div class="brand">天统AI云中台</div><nav id="menu" class="menu"></nav></aside><main><header class="topbar"><strong>广告中心</strong><div class="top-meta"><span id="currentTime" class="pill"></span><span id="systemStatus" class="pill">系统检查中</span><span id="me" class="pill">加载中</span><button data-rbac-action="ads-001">退出登录</button></div></header><section class="content"><div class="card"><h1>广告中心</h1><div class="sub">广告花费、投产比、计划表现和渠道分析将在这里统一管理。当前等待后端广告计划与投放明细接口完成。</div></div></section></main></div>

<script type="text/plain" data-rbac-protected>

const menus=[['老板驾驶舱','/index.html'],['老板控制中心','/control.html'],['店铺管理','/stores.html'],['京东60店数据中心','/jd-dashboard.html'],['京东数据接入','/jd-integrations.html'],['广告中心','/ads.html'],['今日数据录入','/metrics.html'],['Excel导入','/import.html'],['AI素材中心','/ai-assets.html'],['AI工作流中心','/workflows.html'],['AI员工中心','/ai-employees.html'],['账号资料中心','/account-center.html'],['模板中心','/template-center.html'],['品牌中心','/brands.html'],['店铺分组','/store-groups.html'],['天藏：知识资产中心','/knowledge-center.html'],['系统设置','/settings.html']];function disabledEntry(){alert('账号资料中心入口已预留，等待后端页面路由开放。');return false}function renderMenu(){menu.innerHTML=menus.map(([l,h])=>`<a class="${h==='/ads.html'?'active ':''}${h.startsWith('#')?'disabled':''}" href="${h}" ${h.startsWith('#')?'data-rbac-action="ads-disabled-entry"':''}>${l}</a>`).join('')}function tick(){currentTime.innerText=new Date().toLocaleString('zh-CN',{hour12:false})}async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html'}async function init(){renderMenu();tick();setInterval(tick,1000);const r=await fetch('/api/me',{credentials:'include'});if(r.status===401){location.href='/login.html';return}const u=await r.json();me.innerText=`${u.display_name} · ${u.role_label||u.role}`;const h=await fetch('/api/health').then(r=>r.json()).catch(()=>null);systemStatus.innerText=h?`服务器正常 · 数据库 ${h.database} · Redis ${h.redis}`:'系统状态获取失败'}init();

</script>
<script type="text/plain" data-rbac-protected>
TiantongRbac.bindActions({
  "ads-disabled-entry":["click",function(event){return disabledEntry();}],
  "ads-001":["click",function(event){return TiantongRbac.logout();}]
});
</script>
