<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老板驾驶舱 - 天统AI经营云中台</title>
<style>body{margin:0;font:14px Arial,"Microsoft YaHei";background:#f3f6fa;color:#172033}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#10233f;color:#dce8f7;padding:20px}.side h2{color:#fff;margin:0 0 24px}.side a{display:block;color:#dce8f7;text-decoration:none;padding:11px;border-radius:6px}.side a.active,.side a:hover{background:#1d4f82}.main{padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters>*{padding:9px;border:1px solid #d7e0eb;border-radius:6px;background:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:8px;padding:15px}.label{color:#63748a;font-size:12px}.value{font-size:24px;font-weight:700;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left}.warn{color:#b45309}@media(max-width:900px){.app{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style><body><div class="app"><aside class="side"><h2>天统AI经营云中台</h2><a class="active" href="/business.html">老板驾驶舱</a><a href="/sales.html">销售中心</a><a href="/promotion-expenses.html">推广费用</a><a href="/stores.html">店铺与主体</a><a href="/import.html">数据导入</a><a href="/reconciliation.html">费用对账</a><a href="/account-center.html">员工与权限</a><a href="/control.html">系统管理</a></aside><main class="main"><div class="top"><h1>老板驾驶舱</h1><span id="state">正在加载真实数据…</span></div><div class="filters"><select id="range"><option value="today">今日</option><option value="month">本月</option></select><select id="store"><option value="">全公司</option></select><button onclick="load()">刷新</button></div><section class="cards" id="cards"></section><div class="grid"><section class="card"><h3>店铺销售排行</h3><table class="table"><thead><tr><th>店铺</th><th>销售额</th><th>订单</th><th>状态</th></tr></thead><tbody id="stores"></tbody></table></section><section class="card"><h3>经营预警</h3><div id="alerts" class="warn">暂无数据；请先导入销售和推广文件。</div></section></div></main></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function load(){try{const [summary,dash]=await Promise.all([fetch('/api/jd/metrics/summary',{credentials:'include'}).then(r=>r.json()),fetch('/api/jd/dashboard',{credentials:'include'}).then(r=>r.json())]);const net=Number(summary.today_sales||0)-Number(summary.refunds||0),ad=Number(summary.ad_spend||0);const cards=[['今日净销售额',money(net)],['本月销售额','暂无数据'],['订单量',summary.orders||0],['预估毛利',money(summary.today_profit)],['推广费用',money(ad)],['推广费率',net?((ad/net)*100).toFixed(2)+'%':'暂无数据']];document.getElementById('cards').innerHTML=cards.map(([l,v])=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');const rows=dash.stores||[];document.getElementById('stores').innerHTML=rows.length?rows.slice(0,20).map(s=>`<tr><td>${esc(s.store_name||s.store_code)}</td><td>${money(s.sales_amount)}</td><td>${s.orders_count||0}</td><td>${esc(s.health_status||'暂无数据')}</td></tr>`).join(''):'<tr><td colspan="4">暂无数据，请导入销售文件</td></tr>';document.getElementById('alerts').innerText=rows.length?'暂无异常预警':'暂无数据；请先导入销售和推广文件。';document.getElementById('state').innerText='真实接口数据已加载';}catch(e){document.getElementById('state').innerText='暂无数据；请先登录并导入文件'}}load();
</script></body></html>
