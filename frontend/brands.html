<!doctype html>

<html lang="zh-CN" data-required-menu="menu.account_center">

<head><style>html{visibility:hidden}</style><script src="/rbac-navigation.js"></script>

  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <title>品牌中心 - 天统AI云中台</title>

  <style>

    :root{--bg:#f4f6f8;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--dark:#111827;--brand:#0f766e;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#101827;color:#cbd5e1;padding:18px 14px}.brand{height:56px;color:white;font-size:19px;font-weight:700;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08)}.menu{display:flex;flex-direction:column;gap:4px;margin-top:14px}.menu a{color:#cbd5e1;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}.menu a.active,.menu a:hover{background:#1f2937;color:white}.topbar{min-height:64px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:16px}.top-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 9px}.ok{color:var(--good)}.content{padding:24px}.hero{background:linear-gradient(135deg,#0f766e,#111827);color:white;border-radius:8px;padding:22px;margin-bottom:16px}.hero h1{margin:0}.hero p{color:#d1fae5}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:white}button{border:0;background:var(--dark);color:white;border-radius:8px;padding:9px 13px;cursor:pointer}button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{width:260px}.state{border:1px solid var(--line);background:white;border-radius:8px;padding:12px 14px;color:var(--muted);margin-bottom:12px}.state.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc;color:#475569}@media(max-width:900px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.content{padding:18px}.toolbar input{width:100%}}

  .auth-pending .sidebar,.auth-pending .main,.auth-pending main{visibility:hidden}</style>

</head>

<body class="auth-pending">

<div class="app"><aside class="sidebar"><div class="brand">天统AI云中台</div><nav id="menu" class="menu"></nav></aside><main>

    <header class="topbar"><strong>品牌中心</strong><div class="top-meta"><span id="currentTime" class="pill"></span><span id="systemStatus" class="pill">系统检查中</span><span id="me" class="pill">加载中</span><button data-rbac-action="brands-001">退出登录</button></div></header>

    <section class="content">

      <div class="hero"><h1>品牌中心</h1><p>维护京东60店品牌资料、负责人和运营备注。</p></div>

      <div class="card"><h2>新增品牌</h2><div class="grid"><div><label>品牌编码</label><input id="brand_code" placeholder="BR001"></div><div><label>品牌名称</label><input id="brand_name" placeholder="品牌名称"></div><div><label>品牌负责人</label><input id="owner_name" placeholder="负责人"></div><div><label>备注</label><input id="notes" placeholder="备注"></div><button data-rbac-action="brands-002">保存品牌</button></div></div>

      <div class="card"><h2>品牌列表</h2><div class="toolbar"><input id="search" placeholder="搜索品牌/负责人/备注" data-rbac-action="brands-003"><button class="secondary" data-rbac-action="brands-004">刷新表格</button></div></div>

      <div id="pageState" class="state">正在加载品牌...</div>

      <div class="table-wrap"><table><thead><tr><th>ID</th><th>编码</th><th>品牌</th><th>负责人</th><th>备注</th></tr></thead><tbody id="rows"></tbody></table></div>

    </section></main></div>

<script type="text/plain" data-rbac-protected>

const menus=[['老板驾驶舱','/index.html'],['老板控制中心','/control.html'],['店铺管理','/stores.html'],['京东60店数据中心','/jd-dashboard.html'],['京东数据接入','/jd-integrations.html'],['广告中心','/ads.html'],['今日数据录入','/metrics.html'],['Excel导入','/import.html'],['AI素材中心','/ai-assets.html'],['AI工作流中心','/workflows.html'],['AI员工中心','/ai-employees.html'],['账号资料中心','/account-center.html'],['模板中心','/template-center.html'],['品牌中心','/brands.html'],['店铺分组','/store-groups.html'],['天藏：知识资产中心','/knowledge-center.html'],['系统设置','/settings.html']];let tableRows=[];

function renderMenu(){menu.innerHTML=menus.map(([l,h])=>`<a class="${h==='/brands.html'?'active':''}" href="${h}">${l}</a>`).join('')}function tick(){currentTime.innerText=new Date().toLocaleString('zh-CN',{hour12:false})}async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html'}async function api(url,options={}){const res=await fetch(url,{credentials:'include',...options});if(res.status===401){location.href='/login.html';return}if(!res.ok)throw new Error((await res.json().catch(()=>({}))).detail||'操作失败');return res.json()}async function init(){renderMenu();tick();setInterval(tick,1000);const user=await api('/api/me');me.innerText=`${user.display_name} · ${user.role_label||user.role}`;const h=await fetch('/api/health').then(r=>r.json()).catch(()=>null);systemStatus.innerText=h?`服务器正常 · 数据库 ${h.database} · Redis ${h.redis}`:'系统状态获取失败';if(h)systemStatus.classList.add('ok')}

async function loadBrands(){try{pageState.className='state';pageState.innerText='正在加载品牌...';tableRows=await api('/api/brands');renderRows()}catch(e){pageState.className='state error';pageState.innerText=e.message||'品牌加载失败';rows.innerHTML='<tr><td colspan="5">加载失败，请刷新重试</td></tr>'}}

function renderRows(){const q=search.value.trim().toLowerCase();const list=tableRows.filter(b=>!q||[b.brand_code,b.brand_name,b.owner_name,b.notes].join(' ').toLowerCase().includes(q));pageState.innerText=list.length?`已显示 ${list.length} / ${tableRows.length} 个品牌。`:'暂无符合条件的品牌。';rows.innerHTML=list.length?list.map(b=>`<tr><td>${b.id}</td><td>${b.brand_code}</td><td>${b.brand_name}</td><td>${b.owner_name||''}</td><td>${b.notes||''}</td></tr>`).join(''):'<tr><td colspan="5">暂无品牌</td></tr>'}

async function createBrand(){try{await api('/api/brands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand_code:brand_code.value.trim(),brand_name:brand_name.value.trim(),owner_name:owner_name.value.trim(),notes:notes.value.trim()})});document.querySelectorAll('input').forEach(i=>i.value='');await loadBrands()}catch(e){alert(e.message)}}

init().then(loadBrands).catch(e=>{pageState.className='state error';pageState.innerText=e.message||'页面加载失败'});

</script>


<script type="text/plain" data-rbac-protected>
TiantongRbac.bindActions({
  "brands-001":["click",function(event){return TiantongRbac.logout();}],
  "brands-002":["click",function(event){createBrand();}],
  "brands-003":["input",function(event){renderRows();}],
  "brands-004":["click",function(event){loadBrands();}]
});
</script>
</body>

</html>
