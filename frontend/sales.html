<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售中心 - 天统AI经营云中台</title><style>body{font:14px Arial;margin:0;background:#f3f6fa;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.nav a{margin-right:16px;color:#145ea8}.card{background:#fff;border:1px solid #dde6f0;border-radius:8px;padding:18px;margin-top:16px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:24px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style><div class="wrap"><nav class="nav"><a href="/business.html">老板驾驶舱</a><a href="/sales.html">销售中心</a><a href="/promotion-expenses.html">推广费用</a><a href="/import.html">数据导入</a></nav><h1>销售中心</h1><p class="muted">按日期、店铺和主体查看真实销售数据；无数据时不会填充假数据。</p><div class="card"><div class="grid"><div>销售额<div id="sales" class="metric">暂无数据</div></div><div>订单量<div id="orders" class="metric">暂无数据</div></div><div>退款金额<div id="refunds" class="metric">暂无数据</div></div><div>店铺数<div id="stores" class="metric">暂无数据</div></div></div></div><div class="card"><h3>筛选与导入</h3><label>日期 <input type="date" id="date"></label> <label>店铺 <input id="store" placeholder="店铺编号"></label> <a href="/import.html">上传 CSV/XLSX</a><p class="muted">销售趋势、商品排行和明细将在导入真实文件后展示。</p></div></div><script>fetch('/api/jd/metrics/summary',{credentials:'include'}).then(r=>r.json()).then(d=>{sales.textContent=Number(d.today_sales||0).toLocaleString('zh-CN');orders.textContent=d.orders||0;refunds.textContent=Number(d.refunds||0).toLocaleString('zh-CN');stores.textContent=d.stores||0}).catch(()=>{});</script>
