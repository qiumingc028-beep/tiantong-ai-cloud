<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>天统AI经营云中台</title><style>body{font:16px sans-serif;max-width:760px;margin:40px auto;color:#123}button{padding:10px 18px;margin:4px}</style><h1>天统AI经营云中台</h1><p>云端地址：<input id="api" size="42"></p><p>店铺名称 <input id="name" value="全球购免税代购直营店"> 店铺编号 <input id="id" type="number" value="1"></p><p id="status">当前登录状态：未检查</p><button id="open">打开京麦并登录</button><button id="check">检查登录状态</button><button id="schema">采集字段结构</button><button id="export">导出脱敏诊断报告</button><button id="run" disabled>开始正式上传（需认证和字段映射）</button><pre id="result">诊断结果：暂无数据/请登录后采集</pre><p>只读审计：未验证</p><p>验证码/登录失效将暂停本店并提示人工处理。</p><script>const a=window.jdAgent;api.value=a.apiBase;open.onclick=()=>{status.textContent='请在打开的京麦窗口完成人工登录'};check.onclick=()=>{status.textContent='登录状态需在京麦页面确认'};schema.onclick=()=>{result.textContent='本地诊断模式：仅记录字段结构，不上传经营数据'};export.onclick=()=>{const b=new Blob([JSON.stringify({mode:'diagnostic',captured_at:new Date().toISOString(),note:'values omitted'})],{type:'application/json'});const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='jd-readonly-diagnostic.json';x.click()};</script></html>
