<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>天统AI经营云中台</title><style>body{font:16px sans-serif;max-width:760px;margin:40px auto;color:#123}button{padding:10px 18px}</style><h1>天统AI经营云中台</h1><p>云端地址：<span id="api"></span></p><p>店铺名称 <input id="name" value="全球购免税代购直营店"> 店铺编号 <input id="id" type="number" value="1"></p><p id="status">当前登录状态：请人工登录京麦</p><button id="run">开始采集测试</button><pre id="result">采集结果：暂无数据/请导入</pre><p>只读审计：BUSINESS_WRITE_COUNT=0（机器审计）</p><p>验证码/登录失效将暂停本店并提示人工处理。</p><script>const a=window.jdAgent;api.textContent=a.apiBase;run.onclick=async()=>{result.textContent='采集中…';try{result.textContent=JSON.stringify(await a.capture(+id.value,name.value,'0'.repeat(64)),null,2)}catch(e){result.textContent=String(e)}};</script></html>
