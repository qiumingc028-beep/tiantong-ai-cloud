server {
    listen 80;
    server_name tiantongai.com www.tiantongai.com cloud.tiantongai.com www.cloud.tiantongai.com;
    return 301 https://tiantongai.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tiantongai.com www.tiantongai.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/public-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/public-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PUBLIC_SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/public_access.log;
    error_log /var/log/nginx/public_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"tiantongai-public"}';
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cloud.tiantongai.com www.cloud.tiantongai.com;

    ssl_certificate /etc/nginx/certs/legacy-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/legacy-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tiantongai.com$request_uri;
}
