worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events { worker_connections 256; }

http {
  # Viewer tickets are accepted only in POST bodies; keep the entire trusted
  # proxy path out of access logs so malformed query attempts cannot leak them.
  access_log off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8787;
    server_name _;

    location /internal/jd-browser/ {
      proxy_pass http://127.0.0.1:8788;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ~ "^/jd-browser/novnc/(?<store>[A-Za-z0-9_-]{1,64})/exchange$" {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:8788/internal/jd-browser/viewer/exchange/$store$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Content-Type application/json;
      proxy_set_header Host $host;
    }

    location ~ "^/jd-browser/novnc/(?<store>[A-Za-z0-9_-]{1,64})/(?<asset>.*)$" {
      auth_request /_viewer_auth;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_pass http://127.0.0.1:6080/$asset$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /_viewer_auth {
      internal;
      proxy_pass http://127.0.0.1:8788/internal/jd-browser/viewer/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }
  }
}
